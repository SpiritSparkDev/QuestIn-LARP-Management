name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pakyrion_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d pakyrion_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/pakyrion_test
      # Throwaway value for the tests, not a secret.
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  lint-light:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Version files in sync
        run: node scripts/check-version.mjs
      - name: Syntax check
        run: |
          find backend db scripts frontend/js -name '*.js' -o -name '*.mjs' | sort | while read -r f; do
            node --check "$f" || exit 1
          done
      - name: Shell scripts
        run: |
          shellcheck ops/*.sh scripts/*.sh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t questin-ci .

  # Only on main, only after the checks above, and only active once the secret
  # DEPLOY_HOOK_URL exists (Settings > Secrets and variables > Actions).
  # Optional repository variable DEPLOY_HEALTH_URL (e.g. https://host/health)
  # makes the job wait until the new version answers. See docs/deploy.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint-light, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Trigger deploy webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          EXPECTED_VERSION=$(node -e "import('./frontend/js/version.js').then((m) => console.log(m.APP_VERSION))")
          export EXPECTED_VERSION
          sh scripts/deploy-hook.sh
