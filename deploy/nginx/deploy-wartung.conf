# Plesk → Websites & Domains → <Domain> → Apache & nginx Settings →
# "Additional nginx directives". Replaces nginx's own "502 Bad Gateway" /
# "504 Gateway Timeout" (container down or restarting during a deploy) with
# deploy-wartung.html. Details: docs/deploy.md.
#
# Only errors nginx produces itself are replaced: without
# proxy_intercept_errors the app's own 404/500/503 pages and JSON answers
# pass through unchanged.
#
# Adjust the path: where deploy-wartung.html lies on the host (outside the
# container, it must be readable while the app is down).

error_page 502 504 =503 /__deploy-wartung.html;

location = /__deploy-wartung.html {
    internal;
    alias /var/www/vhosts/BEISPIEL.DE/deploy-wartung.html;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
}
