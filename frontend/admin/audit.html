<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protokoll – Pakyrion Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div id="page-loader" class="page-loader"><div class="page-loader-spinner"></div></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand-row">
        <div class="brand-seal"></div>
        <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
      </div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Protokoll</h1>
    <p class="sub">Wichtige Ereignisse im System: Registrierungen, Charaktere, Zahlungen, Gruppen, versendete Links, Exporte und Backups. Kleine Änderungen (Profil, Felder, Texte) werden bewusst nicht protokolliert. Neueste zuerst.</p>
    <div class="card form-pad">
      <select id="audit-category">
        <option value="">Alle Ereignisse</option>
        <option value="accounts">Konten &amp; Rollen</option>
        <option value="characters">Charaktere</option>
        <option value="registrations">Anmeldungen &amp; Check-in</option>
        <option value="payments">Zahlungen</option>
        <option value="groups">Gruppen</option>
        <option value="links">Zugangs- &amp; Einladungslinks</option>
        <option value="exports">Exporte &amp; Backups</option>
        <option value="system">Offline-Betrieb &amp; Datenschutz</option>
      </select>
      <label for="audit-category">Kategorie</label>
    </div>
    <div class="card">
      <div class="table-scroll">
        <table id="audit-list">
          <thead><tr><th>Zeitpunkt</th><th>Wer</th><th>Aktion</th><th>Details</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
import { hideLoading } from '/js/loading.js';
applyBranding();
import { escapeHtml } from '/js/formFields.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
import { notify } from '/js/notifications.js';
initSidebarToggle();

const ACTION_LABELS = {
  'user.registered': 'Konto registriert',
  'role.changed': 'Rolle geändert',
  'character.created': 'Charakter erstellt',
  'character.deleted': 'Charakter gelöscht',
  'character.staff_field_changed': 'Staff-Feld geändert',
  'registration.created': 'Event-Anmeldung',
  'registration.cancelled': 'Anmeldung storniert',
  'registration.admin_create': 'Anmeldung durch Orga',
  'checkin.confirm': 'Check-in-Angaben bestätigt',
  'payment.received': 'Zahlung eingegangen',
  'auth.password_changed': 'Passwort geändert',
  'payment.transfer_notified': 'Überweisung gemeldet',
  'payment.refunded': 'Zahlung erstattet',
  'group.created': 'Rolle (Gruppe) angelegt',
  'group_tree.founded': 'Gruppe gegründet',
  'group_tree.join_code_redeemed': 'Gruppe per Code beigetreten',
  'group_tree.view_characters': 'Gruppenverwaltung sah Charaktere',
  'link.sent': 'Link versendet',
  'invitation.activated': 'Einladung durch Admin aktiviert',
  'user.created_without_email': 'Mitglied ohne E-Mail angelegt',
  'user.email_changed': 'E-Mail-Adresse geändert',
  'members.export': 'Export Mitgliederliste',
  'members.merged': 'Konten zusammengeführt',
  'members.bulk': 'Sammelaktion Mitglieder',
  'checkin.export': 'Export Check-In-Liste',
  'tavern.export': 'Export Tavernenbuchungen',
  'backup.created': 'Backup heruntergeladen',
  'privacy.deletion': 'Daten gelöscht (Datenschutz)',
};
const CATEGORIES = {
  accounts: /^(user|role|members\.bulk|invitation\.activated)/,
  characters: /^character\./,
  registrations: /^(registration|checkin)\./,
  payments: /^payment\./,
  groups: /^group/,
  links: /^link\./,
  exports: /\.export$|^backup\./,
  system: /^(offline|sync|privacy|snapshot)/,
};
const LINK_KINDS = { verification: 'Bestätigungslink', password_reset: 'Passwort-Link', invitation: 'Einladung', invitation_resent: 'Einladung erneut', guest_conversion: 'Gast-Umwandlung' };
const PAYMENT_KINDS = { registration: 'Event-Ticket', tavern_topup: 'Tavernen-Aufladung' };
const euro = (cents) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format((cents ?? 0) / 100);

function describe(entry) {
  const d = entry.details ?? {};
  const who = entry.subjectName ? ` · ${entry.subjectName}` : '';
  switch (entry.action) {
    case 'user.registered': return entry.subjectName ?? '';
    case 'invitation.activated': return `${d.email ?? ''}${who}`;
    case 'user.email_changed': return `${d.from ?? '(keine)'} → ${d.to}${who}`;
    case 'role.changed': return `${d.from} → ${d.to}${who}`;
    case 'character.created':
    case 'character.deleted': return `„${d.characterName}“${who}${d.forced ? ' · trotz Anmeldung gelöscht' : ''}`;
    case 'character.staff_field_changed':
      return `${d.label ?? d.field} bei „${d.characterName}“${entry.subjectName ? ` (${entry.subjectName})` : ''}: ${JSON.stringify(d.from)} → ${JSON.stringify(d.to)}`;
    case 'registration.created': return `${d.eventName ?? ''} · ${d.conRole ?? ''}${d.waitlisted ? ' · Warteliste' : ''}${who}`;
    case 'registration.cancelled': return `${d.self ? 'selbst abgemeldet' : 'von Orga storniert'}${who}`;
    case 'payment.received': return `${euro(d.amountCents)} · ${PAYMENT_KINDS[d.kind] ?? d.kind ?? ''} · ${d.provider ?? ''}${who}`;
    case 'payment.refunded': return `${euro(d.amountCents)}${who}`;
    case 'group.created': return `${d.name} (${d.key})`;
    case 'group_tree.founded': return d.group;
    case 'link.sent': return `${LINK_KINDS[d.kind] ?? d.kind}${d.email ? ` an ${d.email}` : who}${d.emailed === false ? ' · nur Link, keine Mail' : ''}`;
    case 'backup.created': return `Umfang: ${d.scope}`;
    case 'members.export':
    case 'checkin.export':
      return `${d.count} Einträge${d.eventName ? ` · ${d.eventName}` : ''}${d.includesSensitive ? ' · inkl. sensibler Felder erlaubt' : ''}`;
    case 'members.merged': return `${d.mergedName} (${d.mergedEmail ?? 'ohne E-Mail'}) · ${d.registrations} Anmeldung(en) übernommen`;
    case 'members.bulk': return `${d.action}: ${d.ok} von ${d.count} erfolgreich${d.eventName ? ` · ${d.eventName}` : ''}${d.group ? ` · ${d.group}` : ''}`;
    case 'tavern.export':
      return `${d.count} Buchungen · ${d.from}${d.to !== d.from ? ` bis ${d.to}` : ''}`;
    default:
      return Object.keys(d).length ? JSON.stringify(d) : who.replace(' · ', '');
  }
}

async function load() {
  const category = CATEGORIES[document.getElementById('audit-category').value];
  const entries = (await api.get('/audit?limit=1000')).filter((e) => !category || category.test(e.action));
  document.querySelector('#audit-list tbody').innerHTML = entries.length ? entries.map((e) => `<tr>
    <td>${escapeHtml(new Date(e.createdAt).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }))}</td>
    <td>${escapeHtml(e.actorName ?? '–')}</td>
    <td>${escapeHtml(ACTION_LABELS[e.action] ?? e.action)}</td>
    <td>${escapeHtml(describe(e))}</td>
  </tr>`).join('') : '<tr><td colspan="4" class="sub">Keine Einträge.</td></tr>';
}
document.getElementById('audit-category').addEventListener('change', load);

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  await load();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
  else notify(err.status === 403 ? 'Kein Zugriff – nur für Admins.' : err.message, 'error');
} finally {
  hideLoading();
}
</script>
</body>
</html>
