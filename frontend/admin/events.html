<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events verwalten – Pakyrion Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Events verwalten</h1>
    <p class="sub">Lege Events an und bestimme, für welches Event sich Teilnehmende aktuell anmelden können.</p>
    <div class="card">
      <div class="table-scroll">
      <table id="event-list">
        <thead><tr><th>Name</th><th>Datum</th><th>Status</th><th></th><th></th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>

    <dialog id="force-delete-dialog">
      <h2>Event erzwungen löschen</h2>
      <p id="force-delete-warning"></p>
      <p><strong>Alle Teilnehmer werden vom Event abgemeldet. Das kann nicht rückgängig gemacht werden.</strong></p>
      <label><input type="checkbox" id="force-delete-notify"> Teilnehmer per E-Mail über die Absage informieren</label>
      <button type="button" id="force-delete-confirm" class="btn-danger">Endgültig löschen</button>
      <button type="button" id="force-delete-cancel" class="btn-ghost">Abbrechen</button>
    </dialog>

    <div class="card form-pad">
      <h2 id="form-title">Neues Event anlegen</h2>
      <form id="event-form">
        <label for="event-name">Name</label>
        <input id="event-name" name="name" type="text" required>
        <label for="event-date">Datum</label>
        <input id="event-date" name="eventDate" type="date" required>
        <label for="event-code">QR-Code-Kennung <span style="opacity:0.6;font-size:12px;">optional, z.B. P17/2027</span></label>
        <input id="event-code" name="code" type="text" placeholder="P17/2027">
        <label for="event-capacity">Max. Teilnehmerzahl <span style="opacity:0.6;font-size:12px;">optional, leer = unbegrenzt</span></label>
        <input id="event-capacity" name="capacity" type="number" min="1" placeholder="unbegrenzt">
        <label for="event-flags">Sonderrollen <span style="opacity:0.6;font-size:12px;">optional, Komma-getrennt, z.B. GSC, VP, Ersthelfer</span></label>
        <input id="event-flags" name="flags" type="text" placeholder="GSC, VP, Ersthelfer">
        <button type="submit">Speichern</button>
        <button type="button" id="event-cancel-edit" class="btn-ghost">Abbrechen</button>
      </form>
    </div>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { escapeHtml } from '/js/formFields.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
import { notify } from '/js/notifications.js';
initSidebarToggle();

const listBody = document.querySelector('#event-list tbody');
const form = document.getElementById('event-form');
const formTitle = document.getElementById('form-title');
const forceDeleteDialog = document.getElementById('force-delete-dialog');
const forceDeleteWarning = document.getElementById('force-delete-warning');
const forceDeleteNotify = document.getElementById('force-delete-notify');

document.getElementById('force-delete-cancel').addEventListener('click', () => forceDeleteDialog.close());

function openForceDeleteDialog(eventData) {
  forceDeleteWarning.textContent = `"${eventData.name}" hat noch Anmeldungen.`;
  forceDeleteNotify.checked = false;
  forceDeleteDialog.dataset.eventId = eventData.id;
  forceDeleteDialog.showModal();
}

document.getElementById('force-delete-confirm').addEventListener('click', async () => {
  const eventId = forceDeleteDialog.dataset.eventId;
  try {
    await api.delete(`/events/${eventId}`, { force: true, notify: forceDeleteNotify.checked });
    forceDeleteDialog.close();
    notify('Gelöscht.', 'success');
    await loadEvents();
  } catch (err) {
    notify(err.message, 'error');
  }
});

let editingEventId = null;

document.getElementById('event-cancel-edit').addEventListener('click', () => resetForm());

async function loadEvents() {
  listBody.innerHTML = '<tr><td colspan="100%">Wird geladen …</td></tr>';
  const events = await api.get('/events');
  listBody.innerHTML = events.map((e) => `<tr>
    <td>${escapeHtml(e.name)}</td>
    <td>${escapeHtml(e.event_date)}</td>
    <td>${e.is_active ? '<span class="badge badge-active">Aktiv – Anmeldung offen</span>' : '<span class="badge badge-inactive">Inaktiv</span>'}</td>
    <td>${e.is_active ? '' : `<button type="button" class="btn-sm" data-activate="${e.id}">Aktivieren</button>`}</td>
    <td><button type="button" class="btn-sm btn-ghost" data-edit="${e.id}">Bearbeiten</button></td>
    <td><button type="button" class="btn-sm btn-ghost" data-delete="${e.id}">Löschen</button></td>
  </tr>`).join('');

  listBody.querySelectorAll('[data-edit]').forEach((button) => {
    button.addEventListener('click', () => {
      const eventData = events.find((e) => e.id === button.dataset.edit);
      startEdit(eventData);
    });
  });

  listBody.querySelectorAll('[data-activate]').forEach((button) => {
    button.addEventListener('click', async () => {
      try {
        await api.post(`/events/${button.dataset.activate}/activate`, {});
        notify('Event aktiviert.', 'success');
        await loadEvents();
      } catch (err) {
        notify(err.message, 'error');
      }
    });
  });

  listBody.querySelectorAll('[data-delete]').forEach((button) => {
    button.addEventListener('click', async () => {
      const eventData = events.find((e) => e.id === button.dataset.delete);
      if (!confirm(`"${eventData.name}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return;
      try {
        await api.delete(`/events/${button.dataset.delete}`);
        notify('Gelöscht.', 'success');
        await loadEvents();
      } catch (err) {
        if (err.status === 409) { openForceDeleteDialog(eventData); return; }
        notify(err.message, 'error');
      }
    });
  });
}

function startEdit(eventData) {
  editingEventId = eventData.id;
  formTitle.textContent = `Event bearbeiten: ${eventData.name}`;
  form.elements.name.value = eventData.name;
  form.elements.eventDate.value = eventData.event_date;
  form.elements.code.value = eventData.code ?? '';
  form.elements.capacity.value = eventData.capacity ?? '';
  form.elements.flags.value = (eventData.flags ?? []).join(', ');
  form.querySelector('button[type="submit"]').textContent = 'Änderungen speichern';
}

function resetForm() {
  editingEventId = null;
  formTitle.textContent = 'Neues Event anlegen';
  form.reset();
  form.querySelector('button[type="submit"]').textContent = 'Speichern';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const capacityValue = form.elements.capacity.value;
  const payload = {
    name: form.elements.name.value,
    eventDate: form.elements.eventDate.value,
    code: form.elements.code.value || null,
    capacity: capacityValue ? Number(capacityValue) : null,
    clearCapacity: true,
    flags: form.elements.flags.value.split(',').map((f) => f.trim()).filter(Boolean),
  };
  try {
    if (editingEventId) {
      await api.put(`/events/${editingEventId}`, payload);
    } else {
      await api.post('/events', payload);
    }
    notify('Gespeichert.', 'success');
    resetForm();
    await loadEvents();
  } catch (err) {
    notify(err.message, 'error');
  }
});

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  await loadEvents();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
  else if (err.status === 403) { notify('Kein Zugriff – nur für Admin/Moderator.', 'error'); }
}
</script>
</body>
</html>
