<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events verwalten – Pakyrion Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/everest-registry.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot"><a href="#" id="logout-link">Logout</a></div>
  </aside>
  <div class="main"><div class="content">
    <h1>Events verwalten</h1>
    <p class="sub">Lege Events an und bestimme, für welches Event sich Teilnehmende aktuell anmelden können.</p>
    <div class="card">
      <div class="table-scroll">
      <table id="event-list">
        <thead><tr><th>Name</th><th>Datum</th><th>Status</th><th></th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>

    <div class="card form-pad">
      <h2 id="form-title">Neues Event anlegen</h2>
      <form id="event-form">
        <label for="event-name">Name</label>
        <input id="event-name" name="name" type="text" required>
        <label for="event-date">Datum</label>
        <input id="event-date" name="eventDate" type="date" required>
        <label for="event-code">QR-Code-Kennung <span style="opacity:0.6;font-size:12px;">optional, z.B. P17/2027</span></label>
        <input id="event-code" name="code" type="text" placeholder="P17/2027">
        <hr class="hr">
        <h3>Charakterformular</h3>
        <div id="schema-rows"></div>
        <button type="button" id="add-field">Feld hinzufügen</button>
        <button type="button" id="load-template">Standard-Vorlage laden</button>
        <button type="submit">Speichern</button>
        <button type="button" id="event-cancel-edit" class="btn-ghost">Abbrechen</button>
      </form>
    </div>
    <p id="message"></p>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { escapeHtml } from '/js/formFields.js';
import { DEFAULT_CHARACTER_SCHEMA } from '/js/defaultCharacterSchema.js';
import { renderNavLinks } from '/js/nav.js';

const listBody = document.querySelector('#event-list tbody');
const form = document.getElementById('event-form');
const schemaRows = document.getElementById('schema-rows');
const message = document.getElementById('message');
const formTitle = document.getElementById('form-title');

let editingEventId = null;

function addSchemaRow(field = { key: '', label: '', type: 'text', required: false, public: false, options: [] }) {
  const row = document.createElement('div');
  row.className = 'schema-row';
  const optionsValue = Array.isArray(field.options) ? field.options.join(', ') : '';
  row.innerHTML = `
    <input type="text" placeholder="key" class="schema-key" value="${escapeHtml(field.key)}">
    <input type="text" placeholder="Label" class="schema-label" value="${escapeHtml(field.label)}">
    <select class="schema-type">
      <option value="text" ${field.type === 'text' ? 'selected' : ''}>Text</option>
      <option value="textarea" ${field.type === 'textarea' ? 'selected' : ''}>Textarea</option>
      <option value="select" ${field.type === 'select' ? 'selected' : ''}>Auswahl</option>
      <option value="number" ${field.type === 'number' ? 'selected' : ''}>Zahl</option>
      <option value="boolean" ${field.type === 'boolean' ? 'selected' : ''}>Ja/Nein</option>
      <option value="multiselect" ${field.type === 'multiselect' ? 'selected' : ''}>Mehrfachauswahl</option>
      <option value="link" ${field.type === 'link' ? 'selected' : ''}>Link</option>
    </select>
    <input type="text" placeholder="Optionen (kommagetrennt, nur bei Auswahl)" class="schema-options" value="${escapeHtml(optionsValue)}">
    <label><input type="checkbox" class="schema-required" ${field.required ? 'checked' : ''}> Pflichtfeld</label>
    <label><input type="checkbox" class="schema-public" ${field.public ? 'checked' : ''}> Öffentlich sichtbar</label>
    <button type="button" class="remove-row">Entfernen</button>
  `;
  row.querySelector('.remove-row').addEventListener('click', () => row.remove());
  schemaRows.appendChild(row);
}

document.getElementById('add-field').addEventListener('click', () => addSchemaRow());
document.getElementById('event-cancel-edit').addEventListener('click', () => resetForm());

document.getElementById('load-template').addEventListener('click', () => {
  schemaRows.innerHTML = '';
  DEFAULT_CHARACTER_SCHEMA.forEach((field) => addSchemaRow(field));
});

function collectSchema() {
  return [...schemaRows.children].map((row) => {
    const type = row.querySelector('.schema-type').value;
    const field = {
      key: row.querySelector('.schema-key').value.trim(),
      label: row.querySelector('.schema-label').value.trim(),
      type,
      required: row.querySelector('.schema-required').checked,
      public: row.querySelector('.schema-public').checked,
    };
    if (type === 'select' || type === 'multiselect') {
      field.options = row.querySelector('.schema-options').value
        .split(',')
        .map((opt) => opt.trim())
        .filter((opt) => opt.length > 0);
    }
    return field;
  }).filter((field) => field.key.length > 0);
}

async function loadEvents() {
  listBody.innerHTML = '<tr><td colspan="100%">Wird geladen …</td></tr>';
  const events = await api.get('/events');
  listBody.innerHTML = events.map((e) => `<tr>
    <td>${escapeHtml(e.name)}</td>
    <td>${escapeHtml(e.event_date)}</td>
    <td>${e.is_active ? '<span class="badge badge-active">Aktiv – Anmeldung offen</span>' : '<span class="badge badge-inactive">Inaktiv</span>'}</td>
    <td>${e.is_active ? '' : `<button type="button" class="btn-sm" data-activate="${e.id}">Aktivieren</button>`}</td>
    <td><button type="button" class="btn-sm btn-ghost" data-edit="${e.id}">Bearbeiten</button></td>
  </tr>`).join('');

  listBody.querySelectorAll('[data-edit]').forEach((button) => {
    button.addEventListener('click', () => {
      const eventData = events.find((e) => e.id === button.dataset.edit);
      startEdit(eventData);
    });
  });

  listBody.querySelectorAll('[data-activate]').forEach((button) => {
    button.addEventListener('click', async () => {
      message.textContent = '';
      message.className = '';
      try {
        await api.post(`/events/${button.dataset.activate}/activate`, {});
        message.textContent = 'Event aktiviert.';
        message.className = 'success';
        await loadEvents();
      } catch (err) {
        message.textContent = err.message;
        message.className = 'error';
      }
    });
  });
}

function startEdit(eventData) {
  editingEventId = eventData.id;
  formTitle.textContent = `Event bearbeiten: ${eventData.name}`;
  form.elements.name.value = eventData.name;
  form.elements.eventDate.value = eventData.event_date;
  form.elements.code.value = eventData.code ?? '';
  schemaRows.innerHTML = '';
  eventData.character_form_schema.forEach((field) => addSchemaRow(field));
  form.querySelector('button[type="submit"]').textContent = 'Änderungen speichern';
}

function resetForm() {
  editingEventId = null;
  formTitle.textContent = 'Neues Event anlegen';
  form.reset();
  schemaRows.innerHTML = '';
  form.querySelector('button[type="submit"]').textContent = 'Speichern';
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  message.className = '';
  const payload = {
    name: form.elements.name.value,
    eventDate: form.elements.eventDate.value,
    code: form.elements.code.value || null,
    characterFormSchema: collectSchema(),
  };
  try {
    if (editingEventId) {
      await api.put(`/events/${editingEventId}`, payload);
    } else {
      await api.post('/events', payload);
    }
    message.textContent = 'Gespeichert.';
    message.className = 'success';
    resetForm();
    await loadEvents();
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  await loadEvents();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
  else if (err.status === 403) { message.textContent = 'Kein Zugriff – nur für Admin/Moderator.'; message.className = 'error'; }
}
</script>
</body>
</html>
