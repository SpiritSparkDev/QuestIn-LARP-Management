<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branding – Pakyrion Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="/css/sahara.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Branding</h1>
    <p class="sub">Logo, App-Titel und Event-Name für andere Organisationen anpassen.</p>
    <div class="card form-pad">
      <form id="branding-form">
        <div class="field-below">
          <label for="app-title">App-Titel</label>
          <input id="app-title" name="appTitle" type="text" placeholder="Pakyrion">
        </div>
        <div class="field-below">
          <label for="event-name">Event-Name</label>
          <input id="event-name" name="eventName" type="text" placeholder="P17/2027">
        </div>
        <div class="field-below">
          <label for="logo-url">Logo-URL</label>
          <input id="logo-url" name="logoUrl" type="url" placeholder="https://example.com/logo.png">
        </div>
        <p class="sub" id="logo-url-note" style="display:none;">Ein hochgeladenes Logo hat Vorrang vor dieser URL.</p>
        <div class="field-below">
          <label for="quota-mb">Speicher-Kontingent pro Charakter (MB)</label>
          <input id="quota-mb" name="quotaMbPerCharacter" type="number" min="1" step="1" placeholder="100">
        </div>
        <button type="submit">Speichern</button>
      </form>
      <hr class="hr">
      <h2>Logo hochladen</h2>
      <img id="logo-preview" alt="Aktuelles Logo" style="max-width:120px;max-height:120px;display:none;">
      <p id="logo-preview-empty" class="sub">Kein Logo hochgeladen.</p>
      <input type="file" id="logo-file" accept="image/jpeg,image/png,image/webp">
      <button type="button" id="logo-upload-btn">Hochladen</button>
      <button type="button" id="logo-remove-btn" style="display:none;">Logo entfernen</button>
    </div>
    <p id="message"></p>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
initSidebarToggle();
import { applyBranding } from '/js/branding.js';

applyBranding();

const form = document.getElementById('branding-form');
const message = document.getElementById('message');

async function loadSettings() {
  const settings = await api.get('/app-settings');
  form.elements.appTitle.value = settings.appTitle ?? '';
  form.elements.eventName.value = settings.eventName ?? '';
  form.elements.logoUrl.value = settings.logoUrl ?? '';
  form.elements.quotaMbPerCharacter.value = settings.quotaMbPerCharacter ?? '';
  refreshLogoPreview(settings.hasUploadedLogo);
}

const LOGO_MIME_ALLOWLIST = ['image/jpeg', 'image/png', 'image/webp'];

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function refreshLogoPreview(hasUploadedLogo) {
  const preview = document.getElementById('logo-preview');
  const empty = document.getElementById('logo-preview-empty');
  const removeBtn = document.getElementById('logo-remove-btn');
  const urlNote = document.getElementById('logo-url-note');
  if (hasUploadedLogo) {
    preview.src = `/app-settings/logo?t=${Date.now()}`;
    preview.style.display = '';
    empty.style.display = 'none';
    removeBtn.style.display = '';
    urlNote.style.display = '';
  } else {
    preview.style.display = 'none';
    empty.style.display = '';
    removeBtn.style.display = 'none';
    urlNote.style.display = 'none';
  }
}

document.getElementById('logo-upload-btn').addEventListener('click', async () => {
  message.textContent = '';
  message.className = '';
  const file = document.getElementById('logo-file').files[0];
  if (!file) return;
  if (!LOGO_MIME_ALLOWLIST.includes(file.type)) {
    message.textContent = 'Nicht unterstützter Dateityp.';
    message.className = 'error';
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    message.textContent = 'Datei ist größer als 2 MB.';
    message.className = 'error';
    return;
  }
  try {
    const dataBase64 = await readFileAsBase64(file);
    await api.put('/app-settings/logo', { dataBase64, mimeType: file.type });
    refreshLogoPreview(true);
    await applyBranding();
    message.textContent = 'Logo hochgeladen.';
    message.className = 'success';
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});

document.getElementById('logo-remove-btn').addEventListener('click', async () => {
  if (!confirm('Logo wirklich entfernen?')) return;
  message.textContent = '';
  message.className = '';
  try {
    await api.delete('/app-settings/logo');
    refreshLogoPreview(false);
    await applyBranding();
    message.textContent = 'Logo entfernt.';
    message.className = 'success';
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  message.className = '';
  const data = Object.fromEntries(new FormData(form));
  data.quotaMbPerCharacter = data.quotaMbPerCharacter ? Number(data.quotaMbPerCharacter) : undefined;
  try {
    await api.put('/app-settings', data);
    message.textContent = 'Gespeichert.';
    message.className = 'success';
    await loadSettings();
    await applyBranding();
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  await loadSettings();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
  else if (err.status === 403) { message.textContent = 'Kein Zugriff – nur für Admins.'; message.className = 'error'; }
}
</script>
</body>
</html>
