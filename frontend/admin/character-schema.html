<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charakterschema – Pakyrion Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div id="page-loader" class="page-loader"><div class="page-loader-spinner"></div></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand-row">
        <div class="brand-seal"></div>
        <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
      </div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Feldschemas</h1>
    <p class="sub">Legt fest, welche Felder Charaktere (IT) und Konten/Anmeldungen (OT) haben. SC/GSC-Charaktere teilen sich ein Schema über alle Events hinweg; NSC-Charaktere, Konto-Felder und Anmeldungs-Felder haben je ihr eigenes, ebenfalls app-weites Schema.</p>

    <div class="tabs" id="class-tabs">
      <button type="button" class="tab-btn active" data-tab="sc-schema-tab">SC/GSC</button>
      <button type="button" class="tab-btn" data-tab="nsc-schema-tab">NSC</button>
      <button type="button" class="tab-btn" data-tab="account-schema-tab">Konto</button>
      <button type="button" class="tab-btn" data-tab="registration-schema-tab">Anmeldung</button>
    </div>

    <div class="tab-panel card form-pad" id="sc-schema-tab">
      <div id="sc-schema-rows"></div>
      <button type="button" id="sc-add-field">Feld hinzufügen</button>
      <button type="button" id="sc-load-template">Standard-Vorlage laden</button>
      <div class="save-bar"><button type="button" id="sc-schema-save">Speichern</button></div>
    </div>

    <div class="tab-panel card form-pad" id="nsc-schema-tab" hidden>
      <div id="nsc-schema-rows"></div>
      <button type="button" id="nsc-add-field">Feld hinzufügen</button>
      <div class="save-bar"><button type="button" id="nsc-schema-save">Speichern</button></div>
    </div>

    <div class="tab-panel card form-pad" id="account-schema-tab" hidden>
      <div id="account-schema-rows"></div>
      <button type="button" id="account-add-field">Feld hinzufügen</button>
      <div class="save-bar"><button type="button" id="account-schema-save">Speichern</button></div>
    </div>

    <div class="tab-panel card form-pad" id="registration-schema-tab" hidden>
      <div id="registration-schema-rows"></div>
      <button type="button" id="registration-add-field">Feld hinzufügen</button>
      <div class="save-bar"><button type="button" id="registration-schema-save">Speichern</button></div>
    </div>

  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
import { hideLoading } from '/js/loading.js';
applyBranding();
import { escapeHtml } from '/js/formFields.js';
import { DEFAULT_CHARACTER_SCHEMA } from '/js/defaultCharacterSchema.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
import { notify } from '/js/notifications.js';
initSidebarToggle();

function initTabs(tabsEl) {
  const buttons = [...tabsEl.querySelectorAll('.tab-btn')];
  buttons.forEach((btn) => {
    btn.addEventListener('click', () => {
      buttons.forEach((b) => {
        b.classList.toggle('active', b === btn);
        document.getElementById(b.dataset.tab).hidden = b !== btn;
      });
    });
  });
}
initTabs(document.getElementById('class-tabs'));

// `allowPublic` is false for the two OT (Konto/Anmeldung) tabs -- per spec,
// OT schema fields have no "public" concept at all, unlike IT (character)
// fields, so those tabs must render neither the checkbox nor a `public` key.
function addSchemaRow(container, field = { key: '', label: '', type: 'text', required: false, public: false, staffOnly: false, options: [], group: '' }, { allowPublic = true, allowGroup = false, allowSensitive = false } = {}) {
  const row = document.createElement('div');
  row.className = allowGroup ? 'schema-row schema-row--grouped' : 'schema-row';
  const optionsValue = Array.isArray(field.options) ? field.options.join(' | ') : '';
  const publicCheckboxHtml = allowPublic
    ? `<label><input type="checkbox" class="schema-public" ${field.public ? 'checked' : ''}> Öffentlich sichtbar</label>
       <label><input type="checkbox" class="schema-staff-only" ${field.staffOnly ? 'checked' : ''}> Nur Staff darf bearbeiten</label>
       <label title="Der übergeordnete Gruppenverwalter darf dieses Feld bei Charakteren seiner Untergruppen bearbeiten"><input type="checkbox" class="schema-group-managed" ${field.groupManaged ? 'checked' : ''}> Gruppenverwaltung</label>`
    : '';
  // Every tab (characters, Konto, Anmeldung): show the field as its own card.
  const cardCheckboxHtml = `<label title="Das Feld wird als eigene Card dargestellt"><input type="checkbox" class="schema-card" ${field.card ? 'checked' : ''}> Als Card darstellen</label>`;
  // OT fields only: a "sensitive" field (e.g. health notes) is left out of the
  // CSV exports unless the exporting group has the extra sensitive-export
  // permission. Health notes (key medicalNotes) always count as sensitive.
  const alwaysSensitive = field.key === 'medicalNotes';
  const sensitiveCheckboxHtml = allowSensitive
    ? `<label title="${alwaysSensitive ? 'Gesundheitsdaten sind immer sensibel' : 'Nur mit dem Recht „sensible Felder exportieren“ in CSV-Exporten'}"><input type="checkbox" class="schema-sensitive" ${field.sensitive || alwaysSensitive ? 'checked' : ''} ${alwaysSensitive ? 'disabled' : ''}> Sensibel (CSV-Export nur mit Sonderrecht)</label>`
    : '';
  const groupInputHtml = allowGroup
    ? `<input type="text" placeholder="Gruppe (z.B. Grunddaten) -- leer = Sammelgruppe" class="schema-group" value="${escapeHtml(field.group ?? '')}">`
    : '';
  row.innerHTML = `
    <button type="button" class="move-up" aria-label="Nach oben verschieben">▲</button>
    <button type="button" class="move-down" aria-label="Nach unten verschieben">▼</button>
    <input type="text" placeholder="key" class="schema-key" value="${escapeHtml(field.key)}">
    <input type="text" placeholder="Label" class="schema-label" value="${escapeHtml(field.label)}">
    ${groupInputHtml}
    <select class="schema-type">
      <option value="text" ${field.type === 'text' ? 'selected' : ''}>Text</option>
      <option value="textarea" ${field.type === 'textarea' ? 'selected' : ''}>Textarea</option>
      <option value="document" ${field.type === 'document' ? 'selected' : ''}>Dokument (WYSIWYG-Editor)</option>
      <option value="select" ${field.type === 'select' ? 'selected' : ''}>Auswahl</option>
      <option value="number" ${field.type === 'number' ? 'selected' : ''}>Zahl</option>
      <option value="boolean" ${field.type === 'boolean' ? 'selected' : ''}>Ja/Nein</option>
      <option value="multiselect" ${field.type === 'multiselect' ? 'selected' : ''}>Mehrfachauswahl</option>
      <option value="link" ${field.type === 'link' ? 'selected' : ''}>Link</option>
      <option value="date" ${field.type === 'date' ? 'selected' : ''}>Datum</option>
    </select>
    <input type="text" placeholder="Optionen (getrennt mit |, nur bei Auswahl/Mehrfachauswahl)" class="schema-options" value="${escapeHtml(optionsValue)}">
    <div class="schema-checkboxes">
      <label><input type="checkbox" class="schema-required" ${field.required ? 'checked' : ''}> Pflichtfeld</label>
      ${publicCheckboxHtml}
      ${cardCheckboxHtml}
      ${sensitiveCheckboxHtml}
    </div>
    <button type="button" class="remove-row">Entfernen</button>
    <input type="text" placeholder="Hinweis beim Darüberfahren (optional, max. 500 Zeichen)" maxlength="500" class="schema-hint" value="${escapeHtml(field.hint ?? '')}">
  `;
  row.querySelector('.remove-row').addEventListener('click', () => row.remove());
  row.querySelector('.move-up').addEventListener('click', () => {
    const prev = row.previousElementSibling;
    if (prev) row.parentElement.insertBefore(row, prev);
  });
  row.querySelector('.move-down').addEventListener('click', () => {
    const next = row.nextElementSibling;
    if (next) row.parentElement.insertBefore(next, row);
  });
  container.appendChild(row);
}

function collectSchema(container, { allowPublic = true, allowGroup = false, allowSensitive = false } = {}) {
  return [...container.children].map((row) => {
    const type = row.querySelector('.schema-type').value;
    const field = {
      key: row.querySelector('.schema-key').value.trim(),
      label: row.querySelector('.schema-label').value.trim(),
      type,
      required: row.querySelector('.schema-required').checked,
    };
    const hint = row.querySelector('.schema-hint').value.trim();
    if (hint) field.hint = hint;
    if (allowPublic) {
      field.public = row.querySelector('.schema-public').checked;
      field.staffOnly = row.querySelector('.schema-staff-only').checked;
      // Only stored when set, so existing schemas stay unchanged.
      if (row.querySelector('.schema-group-managed').checked) field.groupManaged = true;
    }
    if (allowGroup) {
      field.group = row.querySelector('.schema-group').value.trim();
    }
    if (row.querySelector('.schema-card').checked) field.card = true;
    // Only stored when set, so existing schemas stay unchanged.
    if (allowSensitive && row.querySelector('.schema-sensitive').checked && !row.querySelector('.schema-sensitive').disabled) {
      field.sensitive = true;
    }
    if (type === 'select' || type === 'multiselect') {
      field.options = row.querySelector('.schema-options').value
        .split('|')
        .map((opt) => opt.trim())
        .filter((opt) => opt.length > 0);
    }
    return field;
  }).filter((field) => field.key.length > 0);
}

function setupSchemaEditor({ rowsId, addFieldId, saveId, endpoint, loadTemplateId, allowPublic = true, allowGroup = false, allowSensitive = false }) {
  const rows = document.getElementById(rowsId);
  document.getElementById(addFieldId).addEventListener('click', () => addSchemaRow(rows, undefined, { allowPublic, allowGroup, allowSensitive }));
  if (loadTemplateId) {
    document.getElementById(loadTemplateId).addEventListener('click', () => {
      rows.innerHTML = '';
      DEFAULT_CHARACTER_SCHEMA.forEach((field) => addSchemaRow(rows, field, { allowPublic, allowGroup, allowSensitive }));
    });
  }
  document.getElementById(saveId).addEventListener('click', async () => {
    try {
      await api.put(endpoint, { schema: collectSchema(rows, { allowPublic, allowGroup, allowSensitive }) });
      notify('Gespeichert.', 'success');
    } catch (err) {
      notify(err.status === 400 && err.body?.error ? err.body.error : err.message, 'error');
    }
  });
  return rows;
}

const scRows = setupSchemaEditor({ rowsId: 'sc-schema-rows', addFieldId: 'sc-add-field', saveId: 'sc-schema-save', endpoint: '/sc-schema', loadTemplateId: 'sc-load-template', allowGroup: true });
const nscRows = setupSchemaEditor({ rowsId: 'nsc-schema-rows', addFieldId: 'nsc-add-field', saveId: 'nsc-schema-save', endpoint: '/nsc-schema', allowGroup: true });
const accountRows = setupSchemaEditor({ rowsId: 'account-schema-rows', addFieldId: 'account-add-field', saveId: 'account-schema-save', endpoint: '/account-schema', allowPublic: false, allowSensitive: true });
const registrationRows = setupSchemaEditor({ rowsId: 'registration-schema-rows', addFieldId: 'registration-add-field', saveId: 'registration-schema-save', endpoint: '/registration-schema', allowPublic: false, allowSensitive: true });

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  if (account.group.key !== 'admin') {
    notify('Kein Zugriff – nur für Admin.', 'error');
  } else {
    const [scSchema, nscSchema, accountSchema, registrationSchema] = await Promise.all([
      api.get('/sc-schema'), api.get('/nsc-schema'), api.get('/account-schema'), api.get('/registration-schema'),
    ]);
    scSchema.forEach((field) => addSchemaRow(scRows, field, { allowGroup: true }));
    nscSchema.forEach((field) => addSchemaRow(nscRows, field, { allowGroup: true }));
    accountSchema.forEach((field) => addSchemaRow(accountRows, field, { allowPublic: false, allowSensitive: true }));
    registrationSchema.forEach((field) => addSchemaRow(registrationRows, field, { allowPublic: false, allowSensitive: true }));
  }
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
} finally {
  hideLoading();
}
</script>
</body>
</html>
