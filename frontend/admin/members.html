<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mitglieder verwalten – Pakyrion Admin</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/sahara.css">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>

<body>
  <div id="page-loader" class="page-loader"><div class="page-loader-spinner"></div></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand-row">
          <div class="brand-seal"></div>
          <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
        </div>
      </div>
      <nav id="nav-links"></nav>
      <div class="sidebar-foot">
        <div id="sidebar-user-info"></div>
        <a href="#" id="logout-link">Logout</a>
      </div>
    </aside>
    <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <div class="main">
      <div class="content">
        <h1>Mitglieder verwalten</h1>
        <p class="sub">Bearbeite bestehende Mitglieder oder lade neue per E-Mail ein.</p>
        <button type="button" id="invite-open">Neues Mitglied anlegen</button>
        <div class="toggle-group toggle-group-sm" style="margin:16px 0 0;">
          <button type="button" class="toggle-btn active" data-view="active">Aktive Mitglieder</button>
          <button type="button" class="toggle-btn" data-view="deactivated">Deaktivierte Mitglieder</button>
        </div>
        <div class="card" style="margin-top:16px;">
          <div class="toolbar"><input class="search" id="member-search" placeholder="Suche nach Name, E-Mail oder Gruppe …"></div>
          <div class="member-filters">
            <div>
              <select id="member-filter-group"></select>
              <label for="member-filter-group">Gruppe</label>
            </div>
            <div>
              <select id="member-filter-kind">
                <option value="">Alle Konten</option>
                <option value="full">Vollkonten</option>
                <option value="guest">Gäste</option>
                <option value="invited">Eingeladen</option>
                <option value="discord">Mit Discord</option>
                <option value="no-discord">Ohne Discord</option>
              </select>
              <label for="member-filter-kind">Kontoart</label>
            </div>
            <div>
              <select id="member-sort"></select>
              <label for="member-sort">Sortieren nach</label>
            </div>
            <div class="member-filter-summary">
              <span class="sub" id="member-count"></span>
              <button type="button" id="member-filter-reset" class="btn-ghost btn-sm">Zurücksetzen</button>
            </div>
          </div>
          <div class="table-scroll">
          <table id="member-list">
            <thead>
              <tr>
                <th data-sort="name">Name</th>
                <th data-sort="email">E-Mail</th>
                <th data-sort="group">Gruppe</th>
                <th data-sort="status">Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          </div>
        </div>

        <dialog id="detail-dialog" class="member-dialog">
          <h2 id="detail-title">Mitglied bearbeiten</h2>
          <div class="tabs" id="detail-tabs">
            <button type="button" class="tab-btn active" data-tab="detail-tab-konto">Konto</button>
            <button type="button" class="tab-btn" data-tab="detail-tab-chars" id="detail-chars-tab-btn">Charaktere</button>
          </div>
          <div class="tab-panel" id="detail-tab-konto">
            <div id="detail-group-wrap" style="display:none;">
              <select id="detail-group" name="group"></select>
              <label for="detail-group">Gruppe</label>
            </div>
            <div id="detail-fields"></div>
            <button type="button" id="detail-save">Konto speichern</button>
          </div>
          <div class="tab-panel" id="detail-tab-chars" hidden>
            <div id="detail-characters"></div>
          </div>
          <div class="dialog-actions">
            <button type="button" id="detail-cancel" class="btn-ghost">Schließen</button>
          </div>
        </dialog>

        <dialog id="invite-dialog">
          <h2>Neues Mitglied einladen</h2>
          <form id="invite-form">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div>
                <input id="invite-first-name" name="firstName" type="text" required>
                <label for="invite-first-name">Vorname</label>
              </div>
              <div>
                <input id="invite-last-name" name="lastName" type="text" required>
                <label for="invite-last-name">Nachname</label>
              </div>
              <div>
                <input id="invite-nickname" name="nickname" type="text">
                <label for="invite-nickname">Rufname</label>
              </div>
              <div>
                <input id="invite-email" name="email" type="email" required>
                <label for="invite-email">E-Mail</label>
              </div>
            </div>
            <div>
              <select id="invite-event" name="eventId">
                <option value="">– keine –</option>
              </select>
              <label for="invite-event">Veranstaltung (optional)</label>
            </div>
            <div id="invite-group-wrap" style="display:none;">
              <select id="invite-group" name="group" disabled></select>
              <label for="invite-group">Gruppe</label>
            </div>
            <div id="invite-fields"></div>
            <label for="invite-send-email"><input id="invite-send-email" name="sendEmail" type="checkbox" checked> Per
              E-Mail versenden</label>
            <button type="submit">Einladung senden</button>
            <button type="button" id="invite-cancel" class="btn-ghost">Abbrechen</button>
          </form>
        </dialog>
        <div id="invite-link-box" style="display:none;">
          <input id="invite-link-text" readonly>
          <label id="invite-link-label" for="invite-link-text">Einladungslink</label>
          <button type="button" id="invite-link-copy">Kopieren</button>
          <button type="button" id="invite-link-send" style="display:none;">Per E-Mail senden</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { applyBranding } from '/js/branding.js';
    import { hideLoading } from '/js/loading.js';
    applyBranding();
    import { escapeHtml, attachLiveValidation, renderEventOptions, renderAccountFieldInput, collectAccountFieldValues, nullifyBlankNumberFields, renderField, collectFieldValues } from '/js/formFields.js';
    import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
    import { notify } from '/js/notifications.js';
    initSidebarToggle();

    let accountSchema = [];

    const listBody = document.querySelector('#member-list tbody');
    const detailDialog = document.getElementById('detail-dialog');
    const inviteDialog = document.getElementById('invite-dialog');
    const detailFields = document.getElementById('detail-fields');
    const detailTitle = document.getElementById('detail-title');
    const detailGroupWrap = document.getElementById('detail-group-wrap');
    const detailGroupSelect = document.getElementById('detail-group');
    const detailCharacters = document.getElementById('detail-characters');
    const inviteFields = document.getElementById('invite-fields');
    const inviteGroupWrap = document.getElementById('invite-group-wrap');
    const inviteGroupSelect = document.getElementById('invite-group');
    const inviteEventSelect = document.getElementById('invite-event');
    const inviteLinkBox = document.getElementById('invite-link-box');
    const inviteLinkText = document.getElementById('invite-link-text');
    const inviteLinkLabel = document.getElementById('invite-link-label');
    const inviteLinkSendBtn = document.getElementById('invite-link-send');
    let accessLinkMemberId = null;
    const searchInput = document.getElementById('member-search');
    let currentSearch = '';

    // ---- Filter, search and sort (all client-side on the loaded list) ----
    const SORT_LABELS = { name: 'Name', email: 'E-Mail', group: 'Gruppe', status: 'Status' };
    const STATUS_RANK = { active: 0, invited: 1, deactivated: 2 };
    const PREFS_KEY = 'memberListPrefs';
    let viewMembers = [];
    let prefs = { group: '', kind: '', sort: 'name', dir: 'asc' };
    try {
      prefs = { ...prefs, ...(JSON.parse(localStorage.getItem(PREFS_KEY)) ?? {}) };
    } catch {
      // No stored preferences (or storage unavailable) -- defaults apply.
    }

    function savePrefs() {
      try {
        localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
      } catch {
        // Storage unavailable (private mode) -- preferences just aren't remembered.
      }
    }

    const sortSelect = document.getElementById('member-sort');
    sortSelect.innerHTML = Object.entries(SORT_LABELS).flatMap(([key, label]) => [
      `<option value="${key}:asc">${label} (A–Z)</option>`,
      `<option value="${key}:desc">${label} (Z–A)</option>`,
    ]).join('');
    const groupFilter = document.getElementById('member-filter-group');
    const kindFilter = document.getElementById('member-filter-kind');

    function refreshGroupFilterOptions() {
      const groups = [...new Set(viewMembers.map((m) => m.group?.name).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));
      if (prefs.group && !groups.includes(prefs.group)) prefs.group = '';
      groupFilter.innerHTML = `<option value="">Alle Gruppen</option>${groups.map((g) => `<option value="${escapeHtml(g)}"${g === prefs.group ? ' selected' : ''}>${escapeHtml(g)}</option>`).join('')}`;
      kindFilter.value = prefs.kind;
      sortSelect.value = `${prefs.sort}:${prefs.dir}`;
    }

    const memberMatchesKind = (m) => {
      switch (prefs.kind) {
        case 'full': return m.status !== 'invited' && !m.isGuest;
        case 'guest': return Boolean(m.isGuest);
        case 'invited': return m.status === 'invited';
        case 'discord': return Boolean(m.discordUsername);
        case 'no-discord': return m.status !== 'invited' && !m.discordUsername;
        default: return true;
      }
    };

    function sortValue(m) {
      switch (prefs.sort) {
        case 'email': return m.email ?? '';
        case 'group': return m.group?.name ?? '';
        case 'status': return String(STATUS_RANK[m.status] ?? 9);
        default: return `${m.lastName ?? ''} ${m.firstName ?? ''} ${m.name ?? ''}`;
      }
    }

    function filteredAndSortedMembers() {
      const term = currentSearch.trim().toLowerCase();
      const matching = viewMembers.filter((m) => {
        if (prefs.group && m.group?.name !== prefs.group) return false;
        if (!memberMatchesKind(m)) return false;
        if (!term) return true;
        return [m.name, m.nickname, m.email, m.group?.name].filter(Boolean).join(' ').toLowerCase().includes(term);
      });
      const direction = prefs.dir === 'desc' ? -1 : 1;
      // Ties fall back to the name so the order is always stable and predictable.
      // Entries without a value (e.g. guests without an e-mail address) always
      // sink to the bottom, whichever direction is chosen.
      return matching.sort((a, b) => {
        const av = sortValue(a).trim();
        const bv = sortValue(b).trim();
        if (Boolean(av) !== Boolean(bv)) return av ? -1 : 1;
        return direction * av.localeCompare(bv, 'de', { numeric: true })
          || `${a.lastName} ${a.firstName}`.localeCompare(`${b.lastName} ${b.firstName}`, 'de');
      });
    }

    function updateMemberSummary(shown) {
      const filtersActive = Boolean(prefs.group || prefs.kind || currentSearch.trim());
      document.getElementById('member-count').textContent = filtersActive
        ? `${shown} von ${viewMembers.length} Mitgliedern`
        : `${viewMembers.length} Mitglieder`;
      document.getElementById('member-filter-reset').hidden = !filtersActive && prefs.sort === 'name' && prefs.dir === 'asc';
      document.querySelectorAll('#member-list th[data-sort]').forEach((th) => {
        const active = th.dataset.sort === prefs.sort;
        th.classList.add('is-sortable');
        th.dataset.dir = active ? prefs.dir : '';
        th.setAttribute('aria-sort', active ? (prefs.dir === 'asc' ? 'ascending' : 'descending') : 'none');
      });
    }

    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value;
      renderMembers();
    });
    groupFilter.addEventListener('change', () => { prefs.group = groupFilter.value; savePrefs(); renderMembers(); });
    kindFilter.addEventListener('change', () => { prefs.kind = kindFilter.value; savePrefs(); renderMembers(); });
    sortSelect.addEventListener('change', () => {
      [prefs.sort, prefs.dir] = sortSelect.value.split(':');
      savePrefs();
      renderMembers();
    });
    document.querySelectorAll('#member-list th[data-sort]').forEach((th) => {
      th.addEventListener('click', () => {
        prefs.dir = prefs.sort === th.dataset.sort && prefs.dir === 'asc' ? 'desc' : 'asc';
        prefs.sort = th.dataset.sort;
        sortSelect.value = `${prefs.sort}:${prefs.dir}`;
        savePrefs();
        renderMembers();
      });
    });
    document.getElementById('member-filter-reset').addEventListener('click', () => {
      prefs = { group: '', kind: '', sort: 'name', dir: 'asc' };
      currentSearch = '';
      searchInput.value = '';
      groupFilter.value = '';
      kindFilter.value = '';
      sortSelect.value = 'name:asc';
      savePrefs();
      renderMembers();
    });

    function showInviteLink(link) {
      inviteLinkLabel.textContent = 'Einladungslink';
      inviteLinkText.value = link;
      accessLinkMemberId = null;
      inviteLinkSendBtn.style.display = 'none';
      inviteLinkBox.style.display = '';
    }

    function showAccessLinkBox(link, memberId) {
      inviteLinkLabel.textContent = 'Zugriffslink';
      inviteLinkText.value = link;
      accessLinkMemberId = memberId;
      inviteLinkSendBtn.style.display = '';
      inviteLinkBox.style.display = '';
    }

    document.getElementById('invite-link-copy').addEventListener('click', async (evt) => {
      const button = evt.currentTarget;
      const originalText = button.textContent;
      try {
        await navigator.clipboard.writeText(inviteLinkText.value);
        button.textContent = 'Kopiert!';
      } catch {
        button.textContent = 'Kopieren fehlgeschlagen';
      }
      setTimeout(() => { button.textContent = originalText; }, 2000);
    });

    inviteLinkSendBtn.addEventListener('click', async () => {
      if (!accessLinkMemberId) return;
      try {
        await api.post(`/members/${accessLinkMemberId}/access-link/send`, {});
        notify('Zugriffslink per E-Mail verschickt.', 'success');
      } catch (err) {
        notify(err.message, 'error');
      }
    });

    let myAccountFields = [];
    // Staff with this permission may edit any member's characters, staffOnly fields included.
    let canOverrideCheckin = false;
    let editingMemberId = null;
    let currentView = 'active';
    let myUserId = null;

    // Invite form: only ever shows/submits fields the caller is permitted to
    // set on a brand-new member.
    function buildFieldInputs(container, values = {}) {
      container.innerHTML = accountSchema
        .filter((field) => myAccountFields.includes(field.key))
        .map((field) => renderAccountFieldInput(field, values[field.key]))
        .join('');
      attachLiveValidation(container);
    }

    // Member-detail view: GET /members/:id already returns every field's value
    // regardless of the viewer's own permissions (only PATCH enforces the
    // allowlist), so show every known field — editable when the caller may
    // change it, read-only text otherwise — instead of silently omitting it.
    function buildDetailFieldInputs(container, values = {}) {
      const nameFieldsHtml = `
    <div class="firstName-container">
      <input id="field-firstName" data-field="firstName" type="text" value="${escapeHtml(values.firstName ?? '')}">
      <label for="field-firstName">Vorname</label>
    </div>
    <div class="lastName-container">
      <input id="field-lastName" data-field="lastName" type="text" value="${escapeHtml(values.lastName ?? '')}">
      <label for="field-lastName">Nachname</label>
    </div>
    <div class="nickname-container">
      <input id="field-nickname" data-field="nickname" type="text" value="${escapeHtml(values.nickname ?? '')}">
      <label for="field-nickname">Rufname</label>
    </div>
  `;
      container.innerHTML = nameFieldsHtml + accountSchema.map((field) => {
        const label = field.label ?? field.key;
        if (myAccountFields.includes(field.key)) {
          const sealedBadge = ' <span class="sealed" title="Dieses Feld ist verschlüsselt gespeichert"><span class="material-symbols-outlined" aria-hidden="true">lock</span></span>';
          return renderAccountFieldInput(field, values[field.key], { sealedBadge });
        }
        return `<div class="${escapeHtml(field.key)}-container"><p>${escapeHtml(values[field.key] ?? '–')}</p><label>${escapeHtml(label)}</label></div>`;
      }).join('');
      attachLiveValidation(container);
    }

    async function loadGroupOptions(selectEl) {
      const groups = await api.get('/groups');
      selectEl.innerHTML = groups.map((g) => `<option value="${escapeHtml(g.key)}">${escapeHtml(g.name)}</option>`).join('');
    }

    async function loadEventOptions(selectEl) {
      const events = await api.get('/events');
      selectEl.innerHTML = renderEventOptions(events, '– keine –');
    }

    async function loadMembers() {
      listBody.innerHTML = '<tr><td colspan="100%">Wird geladen …</td></tr>';
      const members = await api.get(`/members${currentView === 'deactivated' ? '?includeDeactivated=true' : ''}`);
      const visible = currentView === 'deactivated'
        ? members.filter((m) => m.status === 'deactivated')
        : members.filter((m) => m.status !== 'deactivated');

      viewMembers = visible;
      refreshGroupFilterOptions();
      renderMembers();
    }

    function renderMembers() {
      const visible = filteredAndSortedMembers();
      listBody.innerHTML = visible.length ? visible.map((m) => {
        let statusCell;
        let actionsCell;
        const accessLinkBtn = m.status === 'active' && !m.isGuest
          ? `<button type="button" class="btn-sm btn-ghost" data-access-link="${m.id}">Zugriffslink anzeigen</button>`
          : '';
        const guestBadge = m.isGuest ? ` <span class="badge badge-inactive">Gast</span>` : '';
        const conversionLinkBtn = m.isGuest
          ? `<button type="button" class="btn-sm btn-ghost" data-generate-conversion-link="${m.id}">Konvertierungslink erzeugen</button>`
          : '';
        if (m.status === 'active') {
          statusCell = `<span class="badge badge-active">Aktiv</span>${guestBadge}`;
          const deactivateBtn = m.id === myUserId
            ? ''
            : `<button type="button" class="btn-sm btn-ghost" data-deactivate="${m.id}">Deaktivieren</button>`;
          actionsCell = `<button type="button" class="btn-sm btn-ghost" data-edit="${m.id}">Bearbeiten</button> ${deactivateBtn} ${conversionLinkBtn} ${accessLinkBtn}`;
        } else if (m.status === 'deactivated') {
          statusCell = `<span class="badge badge-inactive">Deaktiviert</span>`;
          actionsCell = `<button type="button" class="btn-sm btn-ghost" data-reactivate="${m.id}">Reaktivieren</button>
         <button type="button" class="btn-sm btn-ghost" data-delete="${m.id}">Löschen</button>`;
        } else {
          statusCell = `<span class="badge badge-inactive">Eingeladen${m.expired ? ' (abgelaufen)' : ''}</span>`;
          actionsCell = `<button type="button" class="btn-sm btn-ghost" data-resend="${m.id}">Erneut senden</button>
         <button type="button" class="btn-sm btn-ghost" data-cancel-invite="${m.id}">Absagen</button>`;
        }
        const discordBadge = m.discordUsername
          ? ` <span class="discord-badge" title="Discord: ${escapeHtml(m.discordUsername)}"><svg width="14" height="14" viewBox="0 0 127.14 96.36" aria-hidden="true"><path fill="#5865F2" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg></span>`
          : '';
        return `<tr>
    <td>${escapeHtml(m.name)}${discordBadge}</td>
    <td>${escapeHtml(m.email)}</td>
    <td>${escapeHtml(m.group?.name ?? '–')}</td>
    <td>${statusCell}</td>
    <td>${actionsCell}</td>
  </tr>`;
      }).join('') : '<tr><td colspan="5" class="sub">Keine Mitglieder gefunden.</td></tr>';

      listBody.querySelectorAll('[data-edit]').forEach((button) => {
        button.addEventListener('click', () => openDetail(button.dataset.edit));
      });
      listBody.querySelectorAll('[data-resend]').forEach((button) => {
        button.addEventListener('click', () => resendInvitation(button.dataset.resend));
      });
      listBody.querySelectorAll('[data-cancel-invite]').forEach((button) => {
        button.addEventListener('click', () => cancelInvite(button.dataset.cancelInvite));
      });
      listBody.querySelectorAll('[data-deactivate]').forEach((button) => {
        button.addEventListener('click', () => deactivateMemberRow(button.dataset.deactivate));
      });
      listBody.querySelectorAll('[data-reactivate]').forEach((button) => {
        button.addEventListener('click', () => reactivateMemberRow(button.dataset.reactivate));
      });
      listBody.querySelectorAll('[data-delete]').forEach((button) => {
        button.addEventListener('click', () => deleteMemberRow(button.dataset.delete));
      });
      listBody.querySelectorAll('[data-access-link]').forEach((button) => {
        button.addEventListener('click', () => showAccessLink(button.dataset.accessLink));
      });
      listBody.querySelectorAll('[data-generate-conversion-link]').forEach((button) => {
        button.addEventListener('click', () => generateConversionLink(button.dataset.generateConversionLink));
      });
      updateMemberSummary(visible.length);
    }

    // ---- Charaktere tab -------------------------------------------------
    // Staff (canOverrideCheckin) edit a member's characters right here: one
    // collapsible form per character, built from that class's own schema with
    // every field enabled (staffOnly ones too -- the server only lets staff
    // write those). Everyone else just sees the list.
    const detailTabButtons = [...document.querySelectorAll('#detail-tabs .tab-btn')];
    function showDetailTab(panelId) {
      detailTabButtons.forEach((b) => {
        b.classList.toggle('active', b.dataset.tab === panelId);
        document.getElementById(b.dataset.tab).hidden = b.dataset.tab !== panelId;
      });
    }
    detailTabButtons.forEach((b) => b.addEventListener('click', () => showDetailTab(b.dataset.tab)));

    const CHARACTER_SECTIONS = [
      { characterClass: 'sc', title: 'Spielercharaktere (SC)' },
      { characterClass: 'nsc', title: 'Nichtspielercharaktere (NSC)' },
    ];

    async function renderCharactersTab(member) {
      // One entry per character (the server returns one row per registration),
      // with every event it is registered for.
      const characters = new Map();
      for (const c of member.characters ?? []) {
        if (!characters.has(c.id)) characters.set(c.id, { ...c, events: [] });
        if (c.eventName) characters.get(c.id).events.push(c.eventName);
      }
      const list = [...characters.values()];
      document.getElementById('detail-chars-tab-btn').textContent = `Charaktere (${list.length})`;
      if (list.length === 0) {
        detailCharacters.innerHTML = '<p class="sub">Dieses Mitglied hat noch keine Charaktere.</p>';
        return;
      }

      const eventsLine = (c) => (c.events.length ? escapeHtml(c.events.join(', ')) : 'noch keinem Event zugeordnet');
      if (!canOverrideCheckin) {
        detailCharacters.innerHTML = `<ul>${list.map((c) => `<li>${escapeHtml(c.name)}${c.class === 'nsc' ? ' <span class="tag">NSC</span>' : ''} <span class="sub">${eventsLine(c)}</span></li>`).join('')}</ul>`;
        return;
      }

      detailCharacters.innerHTML = '<p class="sub">Wird geladen …</p>';
      let schemas;
      let details;
      try {
        [schemas, details] = await Promise.all([
          Promise.all(CHARACTER_SECTIONS.map(async ({ characterClass }) => [characterClass, await api.get(`/${characterClass}-schema`).catch(() => [])])).then(Object.fromEntries),
          Promise.all(list.map((c) => api.get(`/characters/${c.id}`))),
        ]);
      } catch (err) {
        detailCharacters.innerHTML = '<p class="error">Die Charaktere konnten nicht geladen werden.</p>';
        notify(err.message, 'error');
        return;
      }
      const dataById = new Map(details.map((d) => [d.id, d]));

      detailCharacters.innerHTML = CHARACTER_SECTIONS.map(({ characterClass, title }) => {
        const ofClass = list.filter((c) => (c.class ?? 'sc') === characterClass);
        if (ofClass.length === 0) return '';
        return `<h3>${title}</h3>${ofClass.map((c) => `
          <details class="member-character">
            <summary><strong>${escapeHtml(c.name)}</strong> <span class="sub">${eventsLine(c)}</span></summary>
            <form class="member-character-form" data-character-id="${escapeHtml(c.id)}" data-character-class="${characterClass}">
              <input name="__name" type="text" required value="${escapeHtml(c.name)}">
              <label>Name</label>
              ${schemas[characterClass].map((field) => `<div class="form-group">${renderField(field, dataById.get(c.id)?.data?.[field.key], `mc-${c.id}-`)}</div>`).join('')}
              <div class="settings-actions"><button type="submit">Speichern</button></div>
            </form>
          </details>`).join('')}`;
      }).join('');

      detailCharacters.querySelectorAll('.member-character-form').forEach((form) => {
        attachLiveValidation(form);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const schema = schemas[form.dataset.characterClass];
          try {
            const saved = await api.put(`/characters/${form.dataset.characterId}`, {
              name: form.elements.__name.value,
              data: collectFieldValues(form, schema),
            });
            form.closest('details').querySelector('summary strong').textContent = saved.name;
            notify('Charakter gespeichert.', 'success');
          } catch (err) {
            notify(err.status === 400 && err.body?.details ? err.body.details.join(', ') : err.message, 'error');
          }
        });
      });
    }

    async function openDetail(memberId) {
      const member = await api.get(`/members/${memberId}`);
      editingMemberId = memberId;
      detailTitle.textContent = `Mitglied bearbeiten: ${member.name}`;
      buildDetailFieldInputs(detailFields, member);

      showDetailTab('detail-tab-konto');
      renderCharactersTab(member);

      if (myAccountFields.includes('group')) {
        detailGroupWrap.style.display = '';
        try {
          await loadGroupOptions(detailGroupSelect);
          detailGroupSelect.value = member.group.key;
        } catch (err) {
          // Same reasoning as the invite form's group selector: a non-admin
          // group with 'group' access can't reach the admin-only /groups
          // endpoint, so the select just stays empty in that case.
        }
      } else {
        detailGroupWrap.style.display = 'none';
      }

      detailDialog.showModal();
    }

    document.getElementById('detail-cancel').addEventListener('click', () => {
      editingMemberId = null;
      detailDialog.close();
    });

    document.getElementById('detail-save').addEventListener('click', async (evt) => {
      const saveButton = evt.currentTarget;
      saveButton.disabled = true;
      const payload = {};
      const detailSchema = [
        { key: 'firstName', type: 'text' }, { key: 'lastName', type: 'text' }, { key: 'nickname', type: 'text' },
        ...accountSchema,
      ];
      Object.assign(payload, nullifyBlankNumberFields(detailSchema, collectAccountFieldValues(detailFields, detailSchema)));
      if (myAccountFields.includes('group') && detailGroupSelect.value) {
        payload.group = detailGroupSelect.value;
      }
      try {
        await api.patch(`/members/${editingMemberId}`, payload);
        notify('Gespeichert.', 'success');
        detailDialog.close();
        await loadMembers();
      } catch (err) {
        notify(err.message, 'error');
      } finally {
        saveButton.disabled = false;
      }
    });

    async function resendInvitation(invitationId) {
      try {
        const result = await api.post(`/members/invitations/${invitationId}/resend`, {});
        if (result.emailSent === false) {
          notify('Erneuter Versand fehlgeschlagen. Bitte SMTP-Einstellungen prüfen.', 'error');
        } else {
          notify('Einladung erneut verschickt.', 'success');
        }
        showInviteLink(result.link);
        await loadMembers();
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    async function cancelInvite(invitationId) {
      try {
        await api.post(`/members/invitations/${invitationId}/cancel`, {});
        notify('Einladung abgesagt.', 'success');
        await loadMembers();
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    async function deactivateMemberRow(id) {
      if (!confirm('Mitglied wirklich deaktivieren? Der Login wird gesperrt und alle aktiven Sitzungen werden sofort beendet.')) return;
      try {
        await api.post(`/members/${id}/deactivate`, {});
        notify('Mitglied deaktiviert.', 'success');
        await loadMembers();
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    async function reactivateMemberRow(id) {
      try {
        await api.post(`/members/${id}/reactivate`, {});
        notify('Mitglied reaktiviert.', 'success');
        await loadMembers();
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    async function deleteMemberRow(id) {
      if (!confirm('Mitglied wirklich endgültig löschen? Das kann nicht rückgängig gemacht werden.')) return;
      try {
        await api.delete(`/members/${id}`);
        notify('Mitglied gelöscht.', 'success');
        await loadMembers();
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    async function showAccessLink(id) {
      try {
        const result = await api.get(`/members/${id}/access-link`);
        showAccessLinkBox(result.link, id);
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    async function generateConversionLink(id) {
      try {
        const result = await api.post(`/members/${id}/generate-conversion-link`, {});
        showInviteLink(result.link);
        notify('Konvertierungslink erzeugt.', 'success');
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (currentView === btn.dataset.view) return;
        currentView = btn.dataset.view;
        document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('active', b === btn));
        loadMembers();
      });
    });

    document.getElementById('invite-open').addEventListener('click', () => {
      inviteLinkBox.style.display = 'none';
      inviteDialog.showModal();
    });
    document.getElementById('invite-cancel').addEventListener('click', () => {
      document.getElementById('invite-form').reset();
      inviteDialog.close();
    });

    document.getElementById('invite-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitButton = event.target.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      const formData = new FormData(event.target);
      const payload = Object.fromEntries(formData);
      if (!payload.eventId) delete payload.eventId;
      payload.sendEmail = formData.has('sendEmail');
      Object.assign(payload, nullifyBlankNumberFields(accountSchema, collectAccountFieldValues(inviteFields, accountSchema)));
      try {
        const result = await api.post('/members/invite', payload);
        if (result.emailSent === false) {
          notify('Einladung erstellt, aber der E-Mail-Versand ist fehlgeschlagen. Bitte SMTP-Einstellungen prüfen oder über "Erneut senden" in der Mitgliederliste erneut versuchen.', 'error');
        } else if (result.emailSent === null) {
          notify('Einladung erstellt. Link unten kopieren und manuell teilen.', 'success');
        } else {
          notify('Einladung verschickt.', 'success');
        }
        event.target.reset();
        buildFieldInputs(inviteFields);
        inviteDialog.close();
        showInviteLink(result.link);
        await loadMembers();
      } catch (err) {
        notify(err.message, 'error');
      } finally {
        submitButton.disabled = false;
      }
    });

    document.getElementById('logout-link').addEventListener('click', async (evt) => {
      evt.preventDefault();
      if (!confirm('Wirklich abmelden?')) return;
      await api.post('/auth/logout', {});
      window.location.href = '/login.html';
    });

    try {
      const account = await api.get('/account');
      document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
      document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
      myAccountFields = account.accountFields ?? [];
      canOverrideCheckin = account.canOverrideCheckinStatus === true;
      myUserId = account.id;
      accountSchema = await api.get('/account-schema');
      buildFieldInputs(inviteFields);
      await loadEventOptions(inviteEventSelect);
      // The group select is only shown (and thus only ever sent) if the
      // viewer's own group is actually permitted to set it — matching the
      // backend's exact rule for POST /members/invite (a group without
      // 'group' in its account_fields must not hand out a higher group to a
      // brand-new invitee; omitting the field there defaults new invitees to
      // 'sc' server-side).
      if (myAccountFields.includes('group')) {
        inviteGroupWrap.style.display = '';
        inviteGroupSelect.disabled = false;
        try {
          await loadGroupOptions(inviteGroupSelect);
        } catch (err) {
          // Non-admin groups with 'group' access can't list groups (admin-only
          // endpoint) — the invite form's group selector just stays empty in
          // that case; this must not block the rest of the page.
        }
      }
      // Left disabled (its default state in the markup above) when the viewer
      // lacks 'group' permission — a disabled <select> is excluded from
      // FormData entirely, so the field is genuinely omitted from the submit
      // payload rather than sent as an empty string, letting the backend's
      // default-to-'sc' path apply cleanly.
      await loadMembers();
    } catch (err) {
      if (err.status === 401) window.location.href = '/login.html';
      else if (err.status === 403) { notify('Kein Zugriff – nur für Admin/Moderator.', 'error'); }
    } finally {
      hideLoading();
    }
  </script>
</body>

</html>
