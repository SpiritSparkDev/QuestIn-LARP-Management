<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppen verwalten – Pakyrion Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Gruppen verwalten</h1>
    <p class="sub">Lege fest, welche Menüs und Felder jede Gruppe sehen bzw. bearbeiten darf.</p>
    <div class="card">
      <div class="table-scroll">
      <table id="group-list">
        <thead><tr><th>Name</th><th>Schlüssel</th><th>Menüs</th><th>Charaktere bearbeiten</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>

    <button type="button" id="open-create">Neue Gruppe anlegen</button>
    <dialog id="group-dialog">
      <h2 id="form-title">Neue Gruppe anlegen</h2>
      <form id="group-form">
        <div class="field-row" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div>
            <label for="group-name">Name</label>
            <input id="group-name" name="name" type="text" required>
          </div>
          <div>
            <label for="group-key">Schlüssel (nur Kleinbuchstaben, Zahlen, _)</label>
            <input id="group-key" name="key" type="text" required pattern="[a-z0-9_]+">
          </div>
        </div>

        <hr class="hr">
        <h3>Sichtbare Menüs</h3>
        <div class="checkbox-group" id="menu-checkboxes">
          <label><input type="checkbox" value="konto"> Konto</label>
          <label><input type="checkbox" value="mitglieder"> Mitglieder</label>
          <label><input type="checkbox" value="events"> Events</label>
          <label><input type="checkbox" value="checkin"> Check-In</label>
          <label><input type="checkbox" value="dateien"> Dateien</label>
        </div>

        <h3>Bearbeitbare Account-Felder (in der Mitgliederverwaltung)</h3>
        <div class="checkbox-group" id="field-checkboxes">
          <label><input type="checkbox" value="group"> Gruppe</label>
        </div>

        <div class="checkbox-group">
          <label><input type="checkbox" id="can-override-checkin-status"> Darf Check-In-Status frei setzen und alle Charakterfelder sehen (Admin/Orga/SL-Funktion)</label>
        </div>

        <div class="checkbox-group">
          <label><input type="checkbox" id="can-edit-characters"> Darf Charaktere anderer Mitglieder bearbeiten</label>
        </div>

        <button type="submit">Speichern</button>
        <button type="button" id="cancel-edit" class="btn-ghost">Abbrechen</button>
      </form>
    </dialog>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { escapeHtml } from '/js/formFields.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
import { notify } from '/js/notifications.js';
initSidebarToggle();

const fieldCheckboxes = document.getElementById('field-checkboxes');

function appendFieldCheckboxes(schema) {
  fieldCheckboxes.insertAdjacentHTML('beforeend', schema.map((field) =>
    `<label><input type="checkbox" value="${escapeHtml(field.key)}"> ${escapeHtml(field.label ?? field.key)}</label>`
  ).join(''));
}

const listBody = document.querySelector('#group-list tbody');
const form = document.getElementById('group-form');
const formTitle = document.getElementById('form-title');
const nameInput = document.getElementById('group-name');
const keyInput = document.getElementById('group-key');
const cancelButton = document.getElementById('cancel-edit');
const openCreateButton = document.getElementById('open-create');
const dialog = document.getElementById('group-dialog');

let editingGroupId = null;

function getCheckedValues(containerId) {
  return [...document.querySelectorAll(`#${containerId} input:checked`)].map((el) => el.value);
}

function setCheckedValues(containerId, values) {
  document.querySelectorAll(`#${containerId} input`).forEach((el) => {
    el.checked = values.includes(el.value);
  });
}

async function loadGroups() {
  listBody.innerHTML = '<tr><td colspan="100%">Wird geladen …</td></tr>';
  const groups = await api.get('/groups');
  listBody.innerHTML = groups.map((g) => `<tr>
    <td>${escapeHtml(g.name)}</td>
    <td>${escapeHtml(g.key)}</td>
    <td>${g.visible_menus.map((m) => escapeHtml(m)).join(', ') || '–'}</td>
    <td>${g.can_edit_characters ? 'Ja' : 'Nein'}</td>
    <td>${g.is_protected
      ? '<span class="badge badge-inactive">Geschützt</span>'
      : `<button type="button" class="btn-sm btn-ghost" data-edit="${g.id}">Bearbeiten</button> <button type="button" class="btn-sm btn-ghost" data-delete="${g.id}">Löschen</button>`}</td>
  </tr>`).join('');

  listBody.querySelectorAll('[data-edit]').forEach((button) => {
    button.addEventListener('click', () => {
      const group = groups.find((g) => g.id === button.dataset.edit);
      startEdit(group);
    });
  });
  listBody.querySelectorAll('[data-delete]').forEach((button) => {
    button.addEventListener('click', () => deleteGroupRow(button.dataset.delete));
  });
}

async function deleteGroupRow(id) {
  if (!confirm('Gruppe wirklich löschen? Das kann nicht rückgängig gemacht werden.')) return;
  try {
    await api.delete(`/groups/${id}`);
    notify('Gruppe gelöscht.', 'success');
    await loadGroups();
  } catch (err) {
    notify(err.message, 'error');
  }
}

function startEdit(group) {
  editingGroupId = group.id;
  formTitle.textContent = `Gruppe bearbeiten: ${group.name}`;
  nameInput.value = group.name;
  keyInput.value = group.key;
  keyInput.disabled = true;
  setCheckedValues('menu-checkboxes', group.visible_menus);
  setCheckedValues('field-checkboxes', group.account_fields);
  document.getElementById('can-edit-characters').checked = group.can_edit_characters;
  document.getElementById('can-override-checkin-status').checked = group.can_override_checkin_status;
  form.querySelector('button[type="submit"]').textContent = 'Änderungen speichern';
  dialog.showModal();
}

function resetForm() {
  editingGroupId = null;
  formTitle.textContent = 'Neue Gruppe anlegen';
  form.reset();
  keyInput.disabled = false;
  form.querySelector('button[type="submit"]').textContent = 'Speichern';
  dialog.close();
}

cancelButton.addEventListener('click', resetForm);
openCreateButton.addEventListener('click', () => {
  resetForm();
  dialog.showModal();
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const payload = {
    name: nameInput.value,
    visibleMenus: getCheckedValues('menu-checkboxes'),
    accountFields: getCheckedValues('field-checkboxes'),
    canEditCharacters: document.getElementById('can-edit-characters').checked,
    canOverrideCheckinStatus: document.getElementById('can-override-checkin-status').checked,
  };
  try {
    if (editingGroupId) {
      await api.put(`/groups/${editingGroupId}`, payload);
    } else {
      payload.key = keyInput.value;
      await api.post('/groups', payload);
    }
    notify('Gespeichert.', 'success');
    resetForm();
    await loadGroups();
  } catch (err) {
    notify(err.message, 'error');
  }
});

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  const [accountSchema, registrationSchema] = await Promise.all([api.get('/account-schema'), api.get('/registration-schema')]);
  appendFieldCheckboxes(accountSchema);
  appendFieldCheckboxes(registrationSchema);
  await loadGroups();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
  else if (err.status === 403) { notify('Kein Zugriff – nur für Admins.', 'error'); }
}
</script>
</body>
</html>
