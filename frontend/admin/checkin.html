<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-In – Pakyrion Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1/dist/jsQR.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Check-In</h1>
    <p class="sub">Teilnehmerliste für das ausgewählte Event.</p>
    <select id="event-select" aria-label="Event"></select>
    <div class="stat-row">
      <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Gesamt</div></div>
      <div class="stat"><div class="stat-num forest" id="stat-checked-in">0</div><div class="stat-label">Eingecheckt</div></div>
      <div class="stat">
        <div class="stat-label" id="scan-mode-label">QR-Scan</div>
        <div class="toggle-group toggle-group-sm" role="group" aria-labelledby="scan-mode-label">
          <button type="button" class="toggle-btn" data-mode="off">Aus</button>
          <button type="button" class="toggle-btn" data-mode="push">Push</button>
          <button type="button" class="toggle-btn" data-mode="always">An</button>
        </div>
      </div>
    </div>
    <button type="button" id="scan-start" style="display:none;">Scan starten (20s)</button>
    <p id="scan-status" class="sub"></p>
    <video id="scan-video" style="max-width:320px;display:none;" playsinline muted></video>
    <canvas id="scan-canvas" style="display:none;"></canvas>
    <dialog id="scan-dialog">
      <h2>Gescannter Teilnehmer</h2>
      <p><strong id="scan-name"></strong></p>
      <p id="scan-group"></p>
      <p id="scan-status-line"></p>
      <p id="scan-characters"></p>
      <p id="scan-warning" class="error" style="display:none;"></p>
      <button type="button" id="scan-confirm">Einchecken</button>
      <button type="button" id="scan-cancel">Abbrechen</button>
    </dialog>
    <dialog id="edit-dialog">
      <h2 id="edit-dialog-title">Teilnehmer bearbeiten</h2>
      <div id="edit-ot-fields"></div>
      <div id="edit-characters"></div>
      <button type="button" id="edit-save">Speichern</button>
      <button type="button" id="edit-cancel" class="btn-ghost">Schließen</button>
    </dialog>
    <details id="column-settings" class="card form-pad">
      <summary>Spalten</summary>
      <div>
        <span>Charakter-Felder (IT)</span>
        <div id="it-column-checkboxes" class="checkbox-group"></div>
      </div>
      <div>
        <span>Mitglieder-Felder (OT)</span>
        <div id="ot-column-checkboxes" class="checkbox-group"></div>
      </div>
    </details>
    <div class="card">
      <div class="toolbar"><input class="search" id="participant-search" placeholder="Suche nach Name oder Charakter …"></div>
      <div class="table-scroll">
      <div class="grid-table" id="participant-list" role="table" aria-label="Teilnehmerliste">
        <div class="grid-row grid-header" id="participant-list-head">
          <div class="grid-cell" role="columnheader">Name</div>
          <div class="grid-cell" role="columnheader">Charaktere</div>
        </div>
        <div id="participant-list-body" style="display:contents"></div>
      </div>
      </div>
    </div>
    <p id="message"></p>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { escapeHtml, formatFieldValue, STATUS_LABELS, renderEventOptions, renderAccountFieldInput, collectAccountFieldValues, nullifyBlankNumberFields, otFieldValuesEqual, renderField, collectFieldValues } from '/js/formFields.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
initSidebarToggle();
import { parseScanCode } from '/js/qrCode.js';
import { notify } from '/js/notifications.js';

const eventSelect = document.getElementById('event-select');
const participantList = document.getElementById('participant-list');
const listBody = document.getElementById('participant-list-body');
const tableHeadRow = document.getElementById('participant-list-head');
const itColumnCheckboxes = document.getElementById('it-column-checkboxes');
const otColumnCheckboxes = document.getElementById('ot-column-checkboxes');
const message = document.getElementById('message');
const searchInput = document.getElementById('participant-search');
const statTotal = document.getElementById('stat-total');
const statCheckedIn = document.getElementById('stat-checked-in');

const DEFAULT_HOTKEYS = { confirm: 'Enter', cancel: 'Escape', scan: ' ' };
const CON_ROLE_LABELS = { sc: 'SC', nsc: 'NSC', helfer: 'Helfer', orga: 'Orga', hilfs_orga: 'Hilfs-Orga' };
let currentSearch = '';
let canOverride = false;
let canManageMembers = false;
let events = [];
let myAccountFields = [];
let currentSchema = [];
let accountSchema = [];
let registrationSchema = [];
let otFieldsByKey = new Map();
let selectedColumns = { it: [], ot: [] };
let participantsById = new Map();
const STATUS_ORDER = ['waitlisted', 'pending', 'confirmed', 'checked_in', 'checked_out', 'cancelled'];

function loadSelectedColumns(eventId) {
  try {
    const parsed = JSON.parse(localStorage.getItem(`checkinColumns:${eventId}`));
    return { it: Array.isArray(parsed?.it) ? parsed.it : [], ot: Array.isArray(parsed?.ot) ? parsed.ot : [] };
  } catch {
    return { it: [], ot: [] };
  }
}

function saveSelectedColumns() {
  localStorage.setItem(`checkinColumns:${eventSelect.value}`, JSON.stringify(selectedColumns));
}

function renderColumnCheckboxes() {
  itColumnCheckboxes.innerHTML = currentSchema.map((field) => `
    <label><input type="checkbox" data-it-column="${escapeHtml(field.key)}" ${selectedColumns.it.includes(field.key) ? 'checked' : ''}> ${escapeHtml(field.label ?? field.key)}</label>
  `).join('');
  const otKeys = [...otFieldsByKey.keys()].filter((key) => myAccountFields.includes(key));
  otColumnCheckboxes.innerHTML = otKeys.map((key) => `
    <label><input type="checkbox" data-ot-column="${escapeHtml(key)}" ${selectedColumns.ot.includes(key) ? 'checked' : ''}> ${escapeHtml(otFieldsByKey.get(key).label ?? key)}</label>
  `).join('');

  itColumnCheckboxes.querySelectorAll('[data-it-column]').forEach((cb) => {
    cb.addEventListener('change', () => toggleColumn('it', cb.dataset.itColumn, cb.checked));
  });
  otColumnCheckboxes.querySelectorAll('[data-ot-column]').forEach((cb) => {
    cb.addEventListener('change', () => toggleColumn('ot', cb.dataset.otColumn, cb.checked));
  });
}

function toggleColumn(group, key, checked) {
  const set = new Set(selectedColumns[group]);
  if (checked) set.add(key); else set.delete(key);
  selectedColumns[group] = [...set];
  saveSelectedColumns();
  renderTableHead();
  loadParticipants(eventSelect.value);
}

function renderTableHead() {
  const itLabels = selectedColumns.it.map((key) => currentSchema.find((f) => f.key === key)?.label ?? key);
  const otLabels = selectedColumns.ot.map((key) => otFieldsByKey.get(key)?.label ?? key);
  const extraLabels = [...itLabels, ...otLabels];
  const extraTh = extraLabels.map((label) => `<div class="grid-cell" role="columnheader">${escapeHtml(label)}</div>`).join('');
  tableHeadRow.innerHTML = `<div class="grid-cell" role="columnheader">Name</div><div class="grid-cell" role="columnheader">Charaktere</div><div class="grid-cell" role="columnheader">Rolle</div>${extraTh}<div class="grid-cell" role="columnheader">Betrag</div><div class="grid-cell" role="columnheader">Zahlung</div><div class="grid-cell" role="columnheader">Status</div><div class="grid-cell" role="columnheader"></div><div class="grid-cell" role="columnheader"></div><div class="grid-cell" role="columnheader"></div><div class="grid-cell" role="columnheader"></div><div class="grid-cell" role="columnheader"></div><div class="grid-cell" role="columnheader">Override</div>`;
  // grid-template-columns (sahara.css) splices this track-list string in
  // between its fixed tracks -- built here rather than passing a bare
  // count, since repeat()'s count must be >=1 and this needs to handle 0
  // selected IT/OT columns (the default) without producing invalid CSS.
  const extraTracks = extraLabels.length > 0
    ? `repeat(${extraLabels.length}, minmax(120px, 1fr))`
    : '';
  participantList.style.setProperty('--extra-column-tracks', extraTracks);
}

function renderExtraCells(p) {
  const itCells = selectedColumns.it.map((key) => {
    const field = currentSchema.find((f) => f.key === key) ?? { key };
    const values = p.characters.map((c) => formatFieldValue(field, c.data?.[key])).filter((v) => v !== undefined);
    return `<div class="grid-cell">${escapeHtml(values.join(', '))}</div>`;
  }).join('');
  const otCells = selectedColumns.ot.map((key) => {
    const field = otFieldsByKey.get(key) ?? { key };
    return `<div class="grid-cell">${escapeHtml(formatFieldValue(field, p.otFields?.[key]) ?? '')}</div>`;
  }).join('');
  return itCells + otCells;
}

function onEventChanged() {
  selectedColumns = loadSelectedColumns(eventSelect.value);
  selectedColumns.it = selectedColumns.it.filter((key) => currentSchema.some((f) => f.key === key));
  renderColumnCheckboxes();
  renderTableHead();
}

const scanModeButtons = document.querySelectorAll('.toggle-btn[data-mode]');
const scanStartButton = document.getElementById('scan-start');
const scanStatus = document.getElementById('scan-status');
const scanVideo = document.getElementById('scan-video');
const scanCanvas = document.getElementById('scan-canvas');
const scanDialog = document.getElementById('scan-dialog');

let scanStream = null;
let scanIntervalId = null;
let scanPushTimeoutId = null;
let scanDialogAutoCloseId = null;
let dialogOpenForEventId = null;
let scanLookupPending = false;

function stopScanning() {
  if (scanIntervalId) { clearInterval(scanIntervalId); scanIntervalId = null; }
  if (scanPushTimeoutId) { clearTimeout(scanPushTimeoutId); scanPushTimeoutId = null; }
  if (scanStream) { scanStream.getTracks().forEach((track) => track.stop()); scanStream = null; }
  scanVideo.style.display = 'none';
  scanVideo.srcObject = null;
  scanLookupPending = false;
}

async function startScanning({ pushMode }) {
  stopScanning();
  scanStatus.textContent = '';
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch {
    scanStatus.textContent = 'Kamera nicht verfügbar oder Zugriff verweigert.';
    return;
  }
  scanVideo.srcObject = scanStream;
  scanVideo.style.display = '';
  await scanVideo.play();
  const ctx = scanCanvas.getContext('2d', { willReadFrequently: true });

  scanIntervalId = setInterval(() => {
    if (scanDialog.open || scanLookupPending || scanVideo.readyState !== scanVideo.HAVE_ENOUGH_DATA) return;
    scanCanvas.width = scanVideo.videoWidth;
    scanCanvas.height = scanVideo.videoHeight;
    ctx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
    const imageData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    const result = jsQR(imageData.data, imageData.width, imageData.height);
    if (result) handleScannedCode(result.data);
  }, 750);

  if (pushMode) {
    scanPushTimeoutId = setTimeout(() => {
      stopScanning();
      scanStatus.textContent = '';
    }, 20000);
  }
}

async function handleScannedCode(rawCode) {
  const parsed = parseScanCode(rawCode);
  const eventId = eventSelect.value;
  if (!parsed || !eventId) {
    scanStatus.textContent = 'QR-Code hat ein ungültiges Format.';
    return;
  }
  // Set before the first await so the very next 750ms interval tick (which
  // runs synchronously on the main thread) is guaranteed to see it, closing
  // the window where a slow lookup response let a second decode re-enter
  // this function and race to open/populate the dialog concurrently.
  scanLookupPending = true;
  try {
    const lookup = await api.get(`/events/${eventId}/scan-lookup?code=${encodeURIComponent(rawCode)}`);
    openScanDialog(eventId, lookup);
  } catch (err) {
    scanStatus.textContent = err.message;
  } finally {
    scanLookupPending = false;
  }
}

function openScanDialog(eventId, lookup) {
  dialogOpenForEventId = eventId;
  document.getElementById('scan-name').textContent = lookup.name;
  const scanFlagsSuffix = (lookup.flags ?? []).length > 0 ? ` (${lookup.flags.join(', ')})` : '';
  document.getElementById('scan-group').textContent = `Kategorie: ${CON_ROLE_LABELS[lookup.conRole] ?? lookup.conRole}${scanFlagsSuffix}${lookup.nscAvailable ? ' (auch NSC-bereit)' : ''}`;
  document.getElementById('scan-status-line').textContent = `Status: ${STATUS_LABELS[lookup.status] ?? lookup.status}`;
  document.getElementById('scan-characters').textContent = lookup.characters.length > 0
    ? `Charaktere: ${lookup.characters.map((c) => c.name).join(', ')}`
    : '';
  const warning = document.getElementById('scan-warning');
  const confirmButton = document.getElementById('scan-confirm');
  const NOT_READY_MESSAGES = { pending: 'Noch nicht freigegeben.', cancelled: 'Abgesagt.', checked_in: 'Bereits eingecheckt.', checked_out: 'Bereits ausgecheckt.' };
  if (lookup.status !== 'confirmed') {
    warning.textContent = NOT_READY_MESSAGES[lookup.status] ?? 'Nicht bereit zum Einchecken.';
    warning.style.display = '';
    confirmButton.disabled = true;
  } else {
    warning.style.display = 'none';
    confirmButton.disabled = false;
  }
  confirmButton.dataset.userId = lookup.userId;
  scanDialog.showModal();
  // Cross-browser hardening: don't rely on showModal()'s own default-focus
  // behavior (inconsistent across browsers/tablets) to put focus on the
  // confirm button -- do it explicitly so the Enter hotkey has a
  // deterministic, real DOM focus target to activate.
  if (!confirmButton.disabled) confirmButton.focus();
  scanDialogAutoCloseId = setTimeout(() => { if (scanDialog.open) scanDialog.close(); }, 30000);
}

document.getElementById('scan-confirm').addEventListener('click', async (event) => {
  clearTimeout(scanDialogAutoCloseId);
  const userId = event.target.dataset.userId;
  scanDialog.close();
  await transition(dialogOpenForEventId, userId, 'checkin');
});

document.getElementById('scan-cancel').addEventListener('click', () => {
  clearTimeout(scanDialogAutoCloseId);
  scanDialog.close();
});

const editDialog = document.getElementById('edit-dialog');
const editOtFields = document.getElementById('edit-ot-fields');
const editCharacters = document.getElementById('edit-characters');
let editingUserId = null;

function openEditDialog(userId) {
  const p = participantsById.get(userId);
  if (!p) return;
  editingUserId = userId;
  document.getElementById('edit-dialog-title').textContent = `Bearbeiten: ${p.name}`;

  // Derived from the schema/permission intersection, not p.otFields' own
  // keys -- a brand-new admin-added field has no guaranteed presence in the
  // payload for a participant who doesn't have a value yet (see
  // listParticipantsForEvent), so keying off the payload would make it
  // permanently uneditable until someone else set a value first.
  const otKeys = canManageMembers ? [...otFieldsByKey.keys()].filter((key) => myAccountFields.includes(key)) : [];
  const editableOtFields = otKeys.map((key) => otFieldsByKey.get(key)).filter(Boolean);
  editOtFields.innerHTML = editableOtFields.length > 0
    ? `<h3>Weitere Felder</h3>` + editableOtFields.map((field) => renderAccountFieldInput(field, p.otFields[field.key])).join('')
    : '';

  editCharacters.innerHTML = canOverride
    ? (p.characters ?? []).map((c) => `
      <form class="checkin-character-form" data-character-id="${escapeHtml(c.id)}">
        <h3>${escapeHtml(c.name)}</h3>
        ${currentSchema.map((field) => renderField(field, c.data?.[field.key], `char-${c.id}-`)).join('')}
      </form>
    `).join('')
    : '';

  editDialog.showModal();
}

document.getElementById('edit-cancel').addEventListener('click', () => {
  editingUserId = null;
  editDialog.close();
});

document.getElementById('edit-save').addEventListener('click', async () => {
  const original = participantsById.get(editingUserId)?.otFields ?? {};
  const editedFields = [...editOtFields.querySelectorAll('[data-field]')]
    .map((input) => otFieldsByKey.get(input.dataset.field))
    .filter((field, index, arr) => field && arr.findIndex((f) => f.key === field.key) === index);
  const collected = nullifyBlankNumberFields(editedFields, collectAccountFieldValues(editOtFields, editedFields));
  const accountAccountFieldKeys = new Set(accountSchema.map((f) => f.key));
  const accountPayload = {};
  const registrationPayload = {};
  for (const field of editedFields) {
    const originalValue = original[field.key] ?? (field.type === 'boolean' ? false : '');
    const newValue = collected[field.key];
    // Only send a field whose value actually changed -- an edit-save that
    // touched nothing OT-related (e.g. only a character field) must not
    // trigger PATCH /members or PUT .../ot-fields, since either one mails
    // every event orga/hilfs_orga plus every admin/moderator on success.
    if (otFieldValuesEqual(field, originalValue, newValue)) continue;
    if (accountAccountFieldKeys.has(field.key)) accountPayload[field.key] = newValue;
    else registrationPayload[field.key] = newValue;
  }
  const characterForms = [...editCharacters.querySelectorAll('.checkin-character-form')];
  let savedAnything = false;
  let currentStep = '';
  try {
    if (Object.keys(accountPayload).length > 0) {
      currentStep = 'Konto-Feldern';
      await api.patch(`/members/${editingUserId}`, accountPayload);
      savedAnything = true;
    }
    if (Object.keys(registrationPayload).length > 0) {
      currentStep = 'Anmeldungsfeldern';
      await api.put(`/events/${eventSelect.value}/registrations/${editingUserId}/ot-fields`, registrationPayload);
      savedAnything = true;
    }
    for (const form of characterForms) {
      currentStep = 'Charakterfeldern';
      const data = collectFieldValues(form, currentSchema);
      await api.put(`/characters/${form.dataset.characterId}`, { data });
      savedAnything = true;
    }
    notify('Gespeichert.', 'success');
    editDialog.close();
    await loadParticipants(eventSelect.value);
  } catch (err) {
    notify(
      savedAnything
        ? `Teilweise gespeichert, dann Fehler bei ${currentStep}: ${err.message}`
        : err.message,
      'error',
    );
    if (savedAnything) {
      editDialog.close();
      await loadParticipants(eventSelect.value);
    }
  }
});

function setScanMode(mode) {
  localStorage.setItem('qrScanMode', mode);
  scanModeButtons.forEach((button) => button.classList.toggle('active', button.dataset.mode === mode));
  stopScanning();
  scanStartButton.style.display = mode === 'push' ? '' : 'none';
  if (mode === 'always') startScanning({ pushMode: false });
}

scanModeButtons.forEach((button) => {
  button.addEventListener('click', () => setScanMode(button.dataset.mode));
});

scanStartButton.addEventListener('click', () => startScanning({ pushMode: true }));
window.addEventListener('beforeunload', stopScanning);

const savedScanMode = localStorage.getItem('qrScanMode') || 'off';
scanModeButtons.forEach((button) => button.classList.toggle('active', button.dataset.mode === savedScanMode));
scanStartButton.style.display = savedScanMode === 'push' ? '' : 'none';

function applySearchFilter() {
  const term = currentSearch.trim().toLowerCase();
  listBody.querySelectorAll('.grid-row').forEach((row) => {
    const cells = row.querySelectorAll('.grid-cell');
    const text = `${cells[0]?.textContent ?? ''} ${cells[1]?.textContent ?? ''}`.toLowerCase();
    row.style.display = !term || text.includes(term) ? '' : 'none';
  });
}

function renderOverrideCell(p) {
  if (!canOverride || !p.userId) return '';
  const options = STATUS_ORDER.map((s) => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${escapeHtml(STATUS_LABELS[s])}</option>`).join('');
  return `<select data-override="${escapeHtml(p.userId)}" data-prev-status="${escapeHtml(p.status)}" aria-label="Status-Override">${options}</select>`;
}

function renderConRoleCell(p) {
  const label = CON_ROLE_LABELS[p.conRole] ?? p.conRole ?? '–';
  const flagBadges = (p.flags ?? []).map((f) => ` <span class="tag">${escapeHtml(f)}</span>`).join('');
  const badge = flagBadges + (p.nscAvailable ? ' <span class="tag">auch NSC-bereit</span>' : '');
  if (!canOverride || !p.userId) {
    return escapeHtml(label) + badge;
  }
  const options = ['helfer', 'hilfs_orga', 'orga'].map((r) => `<option value="${r}" ${r === p.conRole ? 'selected' : ''}>${CON_ROLE_LABELS[r]}</option>`).join('');
  return `<select data-con-role="${escapeHtml(p.userId)}" aria-label="Rolle ändern">${options}</select>${badge}`;
}

const PAYMENT_METHOD_LABELS = { stripe_card: 'Karte', stripe_paypal: 'PayPal', bank_transfer: 'Überweisung' };

function renderAmountDueCell(p) {
  if (!p.userId) return '';
  const value = p.amountDueCents != null ? (p.amountDueCents / 100).toFixed(2) : '';
  return `<input type="number" min="0" step="0.01" data-amount-due="${escapeHtml(p.userId)}" value="${escapeHtml(value)}" placeholder="kein Betrag" style="width:90px;">`;
}

function renderPaymentStatusCell(p) {
  if (!p.userId) return '';
  if (p.amountDueCents == null) return '<span class="sub">–</span>';
  if (p.paidAt) {
    const label = PAYMENT_METHOD_LABELS[p.paymentMethod] ?? p.paymentMethod ?? 'manuell';
    return `<span class="status-pill status-confirmed">Bezahlt (${escapeHtml(label)})</span> <button type="button" class="btn-ghost" data-mark-unpaid="${escapeHtml(p.userId)}">Zurücksetzen</button>`;
  }
  return `<span class="status-pill status-pending">Offen</span> <button type="button" class="btn-ghost" data-mark-paid="${escapeHtml(p.userId)}">Als bezahlt markieren</button>`;
}

searchInput.addEventListener('input', () => {
  currentSearch = searchInput.value;
  applySearchFilter();
});

// Each action used to share one wide "Actions" cell (buttons wrapping
// awkwardly once several applied to the same row); each now gets its own
// dedicated grid column instead, so the same action always lands in the
// same column across every row -- these five functions are one per column,
// each returning either its one button or '' when that action doesn't
// apply to this participant's current status/permissions.

function renderApproveCell(p) {
  if (p.status !== 'pending' || !canOverride) return '';
  return `<button type="button" class="btn" data-approve="${p.userId}">Freigeben</button>`;
}

function renderCheckinCell(p) {
  if (p.status === 'notified') return '';
  return `<button type="button" class="btn" data-checkin="${p.userId}" ${p.status !== 'confirmed' ? 'disabled' : ''}>Check-In</button>`;
}

function renderCheckoutCell(p) {
  if (p.status === 'notified') return '';
  return `<button type="button" class="btn btn-ghost" data-checkout="${p.userId}" ${p.status !== 'checked_in' ? 'disabled' : ''}>Check-Out</button>`;
}

// "Absagen" cancels two different things depending on status (an open
// invitation vs. an existing registration) but the two are mutually
// exclusive per row and share the same label, so they share one column.
function renderCancelCell(p) {
  if (p.status === 'notified') {
    return canManageMembers ? `<button type="button" class="btn btn-ghost" data-cancel-invitation="${p.invitationId}">Absagen</button>` : '';
  }
  if ((p.status === 'pending' || p.status === 'confirmed') && canOverride) {
    return `<button type="button" class="btn btn-ghost" data-cancel="${p.userId}">Absagen</button>`;
  }
  return '';
}

function renderEditCell(p) {
  if (p.status === 'notified') return '';
  const canEditOt = canManageMembers && [...otFieldsByKey.keys()].some((key) => myAccountFields.includes(key));
  const canEditCharacters = canOverride && (p.characters ?? []).length > 0;
  if (!canEditOt && !canEditCharacters) return '';
  return `<button type="button" class="btn-ghost" data-edit="${p.userId}">Bearbeiten</button>`;
}

async function loadParticipants(eventId) {
  listBody.innerHTML = '<div class="grid-row"><div class="grid-cell" style="grid-column:1/-1;">Wird geladen …</div></div>';
  const participants = await api.get(`/events/${eventId}/participants`);
  participantsById = new Map(participants.map((p) => [p.userId, p]));
  listBody.innerHTML = participants.map((p) => `<div class="grid-row" role="row">
    <div class="grid-cell">${escapeHtml(p.name)}</div>
    <div class="grid-cell">${escapeHtml(p.characters.map((c) => c.name).join(', '))}</div>
    <div class="grid-cell">${renderConRoleCell(p)}</div>
    ${renderExtraCells(p)}
    <div class="grid-cell">${renderAmountDueCell(p)}</div>
    <div class="grid-cell">${renderPaymentStatusCell(p)}</div>
    <div class="grid-cell"><span class="status-pill status-${escapeHtml(p.status)}">${escapeHtml(STATUS_LABELS[p.status] ?? p.status)}</span></div>
    <div class="grid-cell">${renderApproveCell(p)}</div>
    <div class="grid-cell">${renderCheckinCell(p)}</div>
    <div class="grid-cell">${renderCheckoutCell(p)}</div>
    <div class="grid-cell">${renderCancelCell(p)}</div>
    <div class="grid-cell">${renderEditCell(p)}</div>
    <div class="grid-cell">${renderOverrideCell(p)}</div>
  </div>`).join('');

  statTotal.textContent = participants.length;
  statCheckedIn.textContent = participants.filter((p) => p.status === 'checked_in').length;

  listBody.querySelectorAll('[data-checkin]').forEach((button) => {
    button.addEventListener('click', () => transition(eventId, button.dataset.checkin, 'checkin'));
  });
  listBody.querySelectorAll('[data-checkout]').forEach((button) => {
    button.addEventListener('click', () => transition(eventId, button.dataset.checkout, 'checkout'));
  });
  listBody.querySelectorAll('[data-approve]').forEach((button) => {
    button.addEventListener('click', () => transition(eventId, button.dataset.approve, 'approve'));
  });
  listBody.querySelectorAll('[data-cancel]').forEach((button) => {
    button.addEventListener('click', () => transition(eventId, button.dataset.cancel, 'cancel'));
  });
  listBody.querySelectorAll('[data-cancel-invitation]').forEach((button) => {
    button.addEventListener('click', () => cancelInvitationRow(button.dataset.cancelInvitation, eventId));
  });
  listBody.querySelectorAll('[data-override]').forEach((select) => {
    select.addEventListener('change', () => overrideStatus(eventId, select.dataset.override, select.value, select.dataset.prevStatus));
  });
  listBody.querySelectorAll('[data-con-role]').forEach((select) => {
    select.addEventListener('change', () => promoteConRole(eventId, select.dataset.conRole, select.value));
  });
  listBody.querySelectorAll('[data-amount-due]').forEach((input) => {
    input.addEventListener('change', () => setAmountDue(eventId, input.dataset.amountDue, input.value));
  });
  listBody.querySelectorAll('[data-mark-paid]').forEach((button) => {
    button.addEventListener('click', () => setPaymentStatus(eventId, button.dataset.markPaid, true));
  });
  listBody.querySelectorAll('[data-mark-unpaid]').forEach((button) => {
    button.addEventListener('click', () => setPaymentStatus(eventId, button.dataset.markUnpaid, false));
  });
  listBody.querySelectorAll('[data-edit]').forEach((button) => {
    button.addEventListener('click', () => openEditDialog(button.dataset.edit));
  });

  applySearchFilter();
}

async function cancelInvitationRow(invitationId, eventId) {
  try {
    await api.post(`/members/invitations/${invitationId}/cancel`, {});
    await loadParticipants(eventId);
  } catch (err) {
    notify(err.message, 'error');
  }
}

async function transition(eventId, userId, action) {
  try {
    await api.post(`/events/${eventId}/${action}`, { userId });
    await loadParticipants(eventId);
  } catch (err) {
    notify(err.message, 'error');
  }
}

async function overrideStatus(eventId, userId, newStatus, previousStatus) {
  const newIndex = STATUS_ORDER.indexOf(newStatus);
  const previousIndex = STATUS_ORDER.indexOf(previousStatus);
  const isBackward = newIndex < previousIndex;
  const skipsStep = newIndex - previousIndex > 1;
  const confirmMessage = isBackward
    ? 'Bist du sicher? Dies setzt den Status zurück.'
    : 'Bist du sicher? Dies überspringt den Check-in-Schritt.';
  if ((isBackward || skipsStep) && !confirm(confirmMessage)) {
    await loadParticipants(eventId);
    return;
  }
  try {
    await api.put(`/events/${eventId}/checkin/${userId}`, { status: newStatus, previousStatus });
    await loadParticipants(eventId);
  } catch (err) {
    notify(err.message, 'error');
    await loadParticipants(eventId);
  }
}

async function promoteConRole(eventId, userId, conRole) {
  if (!confirm(`Rolle wirklich zu "${CON_ROLE_LABELS[conRole]}" ändern?`)) {
    await loadParticipants(eventId);
    return;
  }
  try {
    await api.put(`/events/${eventId}/registrations/${userId}/con-role`, { conRole });
    await loadParticipants(eventId);
  } catch (err) {
    notify(err.message, 'error');
    await loadParticipants(eventId);
  }
}

async function setAmountDue(eventId, userId, euroValue) {
  const amountDueCents = euroValue === '' ? null : Math.round(Number(euroValue) * 100);
  try {
    await api.patch(`/events/${eventId}/registrations/${userId}/payment`, { amountDueCents });
    await loadParticipants(eventId);
  } catch (err) {
    notify(err.message, 'error');
    await loadParticipants(eventId);
  }
}

async function setPaymentStatus(eventId, userId, markPaid) {
  try {
    await api.patch(`/events/${eventId}/registrations/${userId}/payment`, { markPaid });
    await loadParticipants(eventId);
  } catch (err) {
    notify(err.message, 'error');
    await loadParticipants(eventId);
  }
}

eventSelect.addEventListener('change', () => {
  onEventChanged();
  loadParticipants(eventSelect.value);
});

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

let currentHotkeys = { ...DEFAULT_HOTKEYS };

function isTypingTarget(el) {
  return el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
}

document.addEventListener('keydown', (event) => {
  if (!scanDialog.open && isTypingTarget(document.activeElement)) return;
  if (scanDialog.open) {
    if (event.key === currentHotkeys.confirm) {
      event.preventDefault();
      if (!document.getElementById('scan-confirm').disabled) document.getElementById('scan-confirm').click();
    } else if (event.key === currentHotkeys.cancel) {
      event.preventDefault();
      document.getElementById('scan-cancel').click();
    }
  } else if (event.key === currentHotkeys.scan && scanStartButton.style.display !== 'none' && !event.repeat) {
    event.preventDefault();
    scanStartButton.click();
  }
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  canOverride = !!account.canOverrideCheckinStatus;
  canManageMembers = (account.menus ?? []).includes('mitglieder');
  myAccountFields = account.accountFields ?? [];
  currentHotkeys = { ...DEFAULT_HOTKEYS, ...(account.hotkeys ?? {}) };
  currentSchema = await api.get('/sc-schema');
  [accountSchema, registrationSchema] = await Promise.all([api.get('/account-schema'), api.get('/registration-schema')]);
  otFieldsByKey = new Map([...accountSchema, ...registrationSchema].map((f) => [f.key, f]));
  events = (await api.get('/events')).filter((e) => e.is_active);
  eventSelect.innerHTML = renderEventOptions(events);
  if (events.length > 0) {
    onEventChanged();
    await loadParticipants(events[0].id);
    if (savedScanMode === 'always') startScanning({ pushMode: false });
  } else {
    message.textContent = 'Keine Events vorhanden.';
  }
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
  else if (err.status === 403) { notify('Kein Zugriff – nur für Admin/Moderator.', 'error'); }
}
</script>
