<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rundmail – Pakyrion Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div id="page-loader" class="page-loader"><div class="page-loader-spinner"></div></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand-row">
        <div class="brand-seal"></div>
        <div class="sidebar-brand">Pakyrion<span>Admin</span></div>
      </div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Rundmail</h1>
    <p class="sub">Schreibe alle Angemeldeten eines Events oder ausgewählte Adressen an.</p>
    <div class="card form-pad"><select id="mailing-event"></select><label for="mailing-event">Event</label></div>
    <div class="card form-pad" id="mailing-root"></div>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
import { hideLoading } from '/js/loading.js';
applyBranding();
import { escapeHtml } from '/js/formFields.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
import { notify } from '/js/notifications.js';
import { renderMailingPanel, initEventMailing } from '/js/eventMailing.js';
initSidebarToggle();

const eventSelect = document.getElementById('mailing-event');
const mailingRoot = document.getElementById('mailing-root');
mailingRoot.innerHTML = renderMailingPanel();
const mailing = initEventMailing(mailingRoot);

eventSelect.addEventListener('change', () => mailing.setEvent(eventSelect.value || null));

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  const events = await api.get('/events');
  eventSelect.innerHTML = events.map((e) => `<option value="${escapeHtml(e.id)}"${e.is_active ? ' selected' : ''}>${escapeHtml(e.name)} (${escapeHtml(e.event_date)})</option>`).join('');
  mailing.setEvent(eventSelect.value || null);
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
  else if (err.status === 403) notify('Kein Zugriff.', 'error');
  else notify(err.message, 'error');
} finally {
  hideLoading();
}
</script>
</body>
</html>
