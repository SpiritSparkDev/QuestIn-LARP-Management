<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket sichern – Pakyrion</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<style>
  /* The registration itself is the embeddable widget (widget.js) -- here it just wears the app's colours. */
  #ticket-widget { --pk-accent: var(--primary); --pk-radius: 8px; }
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <div class="folio folio--narrow" style="max-width:600px;">
    <h1 class="text-center">Ticket sichern</h1>
    <div id="ticket-widget"></div>
  </div>
</div>
<script type="module">
import { applyBranding } from '/js/branding.js';
applyBranding();

const code = new URLSearchParams(window.location.search).get('event');
const mount = document.getElementById('ticket-widget');
if (code) mount.dataset.event = code;
mount.dataset.pakyrion = 'ticket';
const script = document.createElement('script');
script.src = '/widget.js';
document.body.append(script);
</script>
</body>
</html>
