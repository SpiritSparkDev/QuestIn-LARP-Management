<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charaktere durchsuchen – Pakyrion</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div id="page-loader" class="page-loader"><div class="page-loader-spinner"></div></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand-row">
        <div class="brand-seal"></div>
        <div class="sidebar-brand">Pakyrion<span>LARP Management</span></div>
      </div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <div class="browse-header">
      <div>
        <h1>Charaktere durchsuchen</h1>
        <p class="sub" id="browse-count">Die öffentlichen Angaben der angemeldeten Charaktere.</p>
      </div>
      <a href="/account.html#charaktere" class="btn-secondary">Zu meinen Charakteren</a>
    </div>
    <div class="browse-toolbar">
      <select id="event-select" aria-label="Event"></select>
      <input type="search" id="browse-search" class="search" placeholder="Nach Name suchen …" aria-label="Nach Name suchen">
    </div>
    <div id="character-list" class="browse-grid"></div>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
import { hideLoading } from '/js/loading.js';
applyBranding();
import { escapeHtml, formatFieldValue, renderEventOptions } from '/js/formFields.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
import { notify } from '/js/notifications.js';
initSidebarToggle();

const eventSelect = document.getElementById('event-select');
const listBody = document.getElementById('character-list');
const searchInput = document.getElementById('browse-search');

let events = [];
let scSchema = [];

const isLong = (field, text) => field.type === 'textarea' || text.length > 90;

function renderValue(field, text) {
  if (field.type === 'link' && /^https?:\/\//.test(text)) {
    return `<a href="${escapeHtml(text)}" target="_blank" rel="noopener">${escapeHtml(text)}</a>`;
  }
  return escapeHtml(text);
}

// Short values become a fact grid; the first two are the card's subtitle
// instead (the schema is admin-defined, so "first two" rather than fixed
// keys). Long free text is clamped with a toggle.
function renderCharacter(character) {
  const entries = scSchema
    .map((field) => ({ field, text: formatFieldValue(field, character.data[field.key]) }))
    .filter(({ text }) => text !== undefined)
    .map(({ field, text }) => ({ field, text: String(text) }));
  const shortEntries = entries.filter(({ field, text }) => !isLong(field, text));
  const longEntries = entries.filter(({ field, text }) => isLong(field, text));
  const subtitleEntries = shortEntries.filter(({ field }) => field.type !== 'boolean' && field.type !== 'link').slice(0, 2);
  const facts = shortEntries.filter((e) => !subtitleEntries.includes(e));
  const subtitle = subtitleEntries.map(({ text }) => text).join(', ');
  return `<article class="browse-card">
    <div class="browse-card-head">
      <div class="browse-monogram" aria-hidden="true">${escapeHtml(character.name.trim().charAt(0).toUpperCase())}</div>
      <div><h3>${escapeHtml(character.name)}</h3>${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ''}</div>
    </div>
    ${facts.length ? `<dl class="browse-facts">${facts.map(({ field, text }) => `<div><dt>${escapeHtml(field.label || field.key)}</dt><dd>${renderValue(field, text)}</dd></div>`).join('')}</dl>` : ''}
    ${longEntries.map(({ field, text }) => `<div class="browse-long"><h4>${escapeHtml(field.label || field.key)}</h4><p>${escapeHtml(text)}</p></div>`).join('')}
  </article>`;
}

function addClampToggles() {
  listBody.querySelectorAll('.browse-long').forEach((block) => {
    const p = block.querySelector('p');
    if (p.scrollHeight <= p.clientHeight + 1) return;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'browse-more';
    button.textContent = 'Mehr anzeigen';
    button.addEventListener('click', () => {
      const open = block.classList.toggle('is-open');
      button.textContent = open ? 'Weniger anzeigen' : 'Mehr anzeigen';
    });
    block.appendChild(button);
  });
}

let allCharacters = [];

function renderList() {
  const count = document.getElementById('browse-count');
  const term = searchInput.value.trim().toLowerCase();
  const shown = allCharacters.filter((c) => c.name.toLowerCase().includes(term));
  if (allCharacters.length === 0) {
    count.textContent = 'Für dieses Event sind noch keine Charaktere angemeldet.';
  } else if (shown.length === 0) {
    count.textContent = `Kein Charakter mit „${searchInput.value.trim()}“ gefunden.`;
  } else {
    const noun = shown.length === 1 ? 'Charakter' : 'Charaktere';
    count.textContent = term
      ? `${shown.length} von ${allCharacters.length} ${allCharacters.length === 1 ? 'Charakter' : 'Charaktere'} gefunden.`
      : `${shown.length} ${noun} mit öffentlichen Angaben.`;
  }
  listBody.innerHTML = shown.map(renderCharacter).join('');
  addClampToggles();
}

async function loadCharacters() {
  const eventId = eventSelect.value;
  if (!eventId) { listBody.innerHTML = ''; return; }
  try {
    allCharacters = await api.get(`/events/${eventId}/characters/public`);
    renderList();
  } catch (err) {
    notify(err.message, 'error');
  }
}

searchInput.addEventListener('input', renderList);

eventSelect.addEventListener('change', loadCharacters);

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  const { characterBrowsingEnabled } = await api.get('/app-settings');
  if (!characterBrowsingEnabled) {
    document.getElementById('browse-count').textContent = 'Die Charakterübersicht ist zurzeit deaktiviert.';
    document.querySelector('.browse-toolbar').hidden = true;
    throw Object.assign(new Error('browsing disabled'), { status: 0 });
  }
  scSchema = await api.get('/sc-schema');
  events = await api.get('/events');
  eventSelect.innerHTML = renderEventOptions(events);
  await loadCharacters();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
} finally {
  hideLoading();
}
</script>
</body>
</html>
