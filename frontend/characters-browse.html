<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charaktere durchsuchen – Pakyrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="/css/sahara.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">Pakyrion</div>
    </div>
    <nav id="nav-links"></nav>
    <div class="sidebar-foot">
      <div id="sidebar-user-info"></div>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </aside>
  <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Menü öffnen">
    <span class="material-symbols-outlined" aria-hidden="true">menu</span>
  </button>
  <div class="main"><div class="content">
    <h1>Charaktere durchsuchen</h1>
    <p><a href="/account.html">← Zurück zu meinen Charakteren</a></p>
    <label for="event-select">Event</label>
    <select id="event-select"></select>
    <div id="character-list" class="char-grid"></div>
    <p id="message"></p>
  </div></div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { escapeHtml, formatFieldValue, renderEventOptions } from '/js/formFields.js';
import { renderNavLinks, renderSidebarUser, initSidebarToggle } from '/js/nav.js';
initSidebarToggle();

const eventSelect = document.getElementById('event-select');
const listBody = document.getElementById('character-list');
const message = document.getElementById('message');

let events = [];
let scSchema = [];

function renderTag(field, value) {
  if (field.type === 'link' && typeof value === 'string' && /^https?:\/\//.test(value)) {
    return `<span class="tag">${escapeHtml(field.label || field.key)}: <a href="${escapeHtml(value)}" target="_blank" rel="noopener">${escapeHtml(value)}</a></span>`;
  }
  return `<span class="tag">${escapeHtml(field.label || field.key)}: ${escapeHtml(value)}</span>`;
}

function tagsForCharacter(character, schema) {
  return schema
    .map((field) => ({ field, value: formatFieldValue(field, character.data[field.key]) }))
    .filter(({ value }) => value !== undefined)
    .map(({ field, value }) => renderTag(field, value))
    .join('');
}

async function loadCharacters() {
  message.textContent = '';
  const eventId = eventSelect.value;
  if (!eventId) { listBody.innerHTML = ''; return; }
  try {
    const characters = await api.get(`/events/${eventId}/characters/public`);
    if (characters.length === 0) {
      listBody.innerHTML = '<p>Keine Charaktere für dieses Event.</p>';
      return;
    }
    listBody.innerHTML = characters.map((c) => `<div class="char-card">
      <h3>${escapeHtml(c.name)}</h3>
      <div class="char-tags">${tagsForCharacter(c, scSchema)}</div>
    </div>`).join('');
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
}

eventSelect.addEventListener('change', loadCharacters);

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  if (!confirm('Wirklich abmelden?')) return;
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
  document.getElementById('sidebar-user-info').innerHTML = renderSidebarUser(account);
  scSchema = await api.get('/sc-schema');
  events = await api.get('/events');
  eventSelect.innerHTML = renderEventOptions(events);
  await loadCharacters();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
}
</script>
</body>
</html>
