<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden – Pakyrion</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">QuestIn LARP Management</p>
  <div class="folio folio--narrow">
    <p class="eyebrow text-center">Willkommen zurück</p>
    <h1 class="text-center">Anmelden</h1>
    <form id="login-form">
      <input id="email" name="email" type="email" required>
      <label for="email">E-Mail</label>
      <input id="password" name="password" type="password" required>
      <label for="password">Passwort</label>
      <button type="submit">Anmelden</button>
    </form>
    <p><a href="#" id="forgot-link">Passwort vergessen?</a></p>
    <div class="divider-word" id="oauth-divider">oder anmelden mit</div>
    <div class="oauth-row" id="oauth-row">
      <a href="/auth/oauth/google/start" data-provider="google">Google</a>
      <a href="/auth/oauth/facebook/start" data-provider="facebook">Facebook</a>
      <a href="/auth/oauth/discord/start" data-provider="discord">Discord</a>
    </div>
    <p class="text-center" style="margin-top:28px;"><a href="/register.html" class="btn-ghost">Noch kein Konto? Registrieren</a></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { notify } from '/js/notifications.js';

const form = document.getElementById('login-form');

(async () => {
  try {
    const res = await fetch('/auth/oauth/providers');
    if (res.ok) {
      const available = await res.json();
      const links = document.querySelectorAll('[data-provider]');
      links.forEach((link) => {
        if (!available[link.dataset.provider]) link.style.display = 'none';
      });
      if (![...links].some((link) => link.style.display !== 'none')) {
        document.getElementById('oauth-divider').style.display = 'none';
        document.getElementById('oauth-row').style.display = 'none';
      }
    }
  } catch {
    // Network hiccup fetching availability — leave every button visible;
    // worst case a misconfigured provider shows its existing 503 error on click.
  }
})();

if (new URLSearchParams(window.location.search).get('oauth_error') === 'denied') {
  notify('Anmeldung abgebrochen.', 'error');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  try {
    await api.post('/auth/login', data);
    window.location.href = '/account.html';
  } catch (err) {
    notify(err.message, 'error');
  }
});

document.getElementById('forgot-link').addEventListener('click', async (event) => {
  event.preventDefault();
  const email = document.getElementById('email').value;
  if (!email) {
    notify('Bitte zuerst die E-Mail-Adresse eingeben.', 'error');
    return;
  }
  try {
    await api.post('/auth/password-reset/request', { email });
    notify('Falls diese E-Mail registriert ist, wurde eine Mail mit einem Reset-Link verschickt.', 'success');
  } catch (err) {
    notify(err.message, 'error');
  }
});
</script>
</body>
</html>
