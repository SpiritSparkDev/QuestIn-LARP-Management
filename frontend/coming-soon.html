<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung startet bald – Pakyrion</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">QuestIn LARP Management</p>
  <div class="folio folio--narrow">
    <h1 class="text-center">Anmeldung startet bald</h1>
    <div id="coming-soon-message"></div>
    <div id="countdown" style="display:none; margin-top:24px;">
      <div style="display:flex; justify-content:center; gap:16px;">
        <div style="text-align:center;">
          <div id="cd-days" style="font-family:'EB Garamond',Georgia,serif; font-size:2rem; color:var(--primary);">0</div>
          <div class="sub">Tage</div>
        </div>
        <div style="text-align:center;">
          <div id="cd-hours" style="font-family:'EB Garamond',Georgia,serif; font-size:2rem; color:var(--primary);">00</div>
          <div class="sub">Std.</div>
        </div>
        <div style="text-align:center;">
          <div id="cd-minutes" style="font-family:'EB Garamond',Georgia,serif; font-size:2rem; color:var(--primary);">00</div>
          <div class="sub">Min.</div>
        </div>
        <div style="text-align:center;">
          <div id="cd-seconds" style="font-family:'EB Garamond',Georgia,serif; font-size:2rem; color:var(--primary);">00</div>
          <div class="sub">Sek.</div>
        </div>
      </div>
      <p id="countdown-done" class="text-center" style="display:none;">Die Anmeldung öffnet jeden Moment.</p>
    </div>
    <form id="remind-me-form" style="margin-top:28px;">
      <p class="eyebrow text-center">Per Mail erinnern lassen</p>
      <input id="remind-firstName" name="firstName" type="text" required>
      <label for="remind-firstName">Vorname</label>
      <input id="remind-lastName" name="lastName" type="text" required>
      <label for="remind-lastName">Nachname</label>
      <input id="remind-email" name="email" type="email" required>
      <label for="remind-email">E-Mail</label>
      <button type="submit">Erinnern lassen</button>
    </form>
    <p class="text-center" style="margin-top:28px;"><a href="/login.html" class="btn-ghost">Für Mitglieder: Anmelden</a></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
import { startCountdown } from '/js/countdown.js';
import { notify } from '/js/notifications.js';
applyBranding();

const messageEl = document.getElementById('coming-soon-message');
const remindForm = document.getElementById('remind-me-form');

remindForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(remindForm));
  try {
    await api.post('/public/coming-soon/remind-me', data);
    notify('Danke! Sobald die Anmeldung startet, bekommst du eine E-Mail.', 'success');
    remindForm.reset();
  } catch (err) {
    notify(err.message, 'error');
  }
});

(async () => {
  let settings;
  try {
    settings = await (await fetch('/app-settings')).json();
  } catch {
    return;
  }

  if (settings.comingSoonMessage) {
    const iframe = document.createElement('iframe');
    iframe.title = 'Nachricht';
    iframe.style.cssText = 'width:100%; border:0; display:block;';
    messageEl.replaceChildren(iframe);
    iframe.srcdoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
      body { font-family: 'Manrope', system-ui, sans-serif; margin: 0; padding: 0; color: #3a302a; text-align: center; overflow: hidden; }
      img { max-width: 100%; height: auto; }
    </style></head><body>${settings.comingSoonMessage}</body></html>`;
    iframe.scrolling = 'no';
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument.documentElement;
        // Re-measure whenever content grows (images load after the iframe's load event).
        new ResizeObserver(() => { iframe.style.height = `${doc.scrollHeight}px`; }).observe(doc);
        iframe.style.height = `${doc.scrollHeight}px`;
      } catch {
        iframe.style.height = '120px';
      }
    });
  }

  if (settings.comingSoonUntil) {
    const target = new Date(settings.comingSoonUntil);
    if (!Number.isNaN(target.getTime()) && target.getTime() > Date.now()) {
      document.getElementById('countdown').style.display = '';
      startCountdown(target, ({ days, hours, minutes, seconds, done }) => {
        document.getElementById('cd-days').textContent = days;
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
        if (done) {
          document.getElementById('countdown-done').style.display = '';
        }
      });
    }
  }
})();
</script>
<script type="module" src="/js/legalFooter.js"></script>
</body>
</html>
