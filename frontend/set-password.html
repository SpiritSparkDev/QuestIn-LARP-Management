<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort festlegen – Pakyrion</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">QuestIn LARP Management</p>
  <div class="folio folio--narrow">
    <p class="eyebrow text-center">Willkommen</p>
    <h1 class="text-center">Passwort festlegen</h1>
    <form id="set-password-form">
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <label for="passwordConfirm">Passwort wiederholen</label>
      <input id="passwordConfirm" type="password" minlength="8" required>
      <label><input type="checkbox" id="password-toggle"> Passwort anzeigen</label>
      <button type="submit" style="width:100%;">Loslegen</button>
    </form>
    <p id="message"></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { notify } from '/js/notifications.js';

const form = document.getElementById('set-password-form');
const message = document.getElementById('message');
const token = new URLSearchParams(window.location.search).get('token');

if (!token) {
  form.style.display = 'none';
  message.textContent = 'Kein Einladungs-Token gefunden.';
  message.className = 'error';
}

const passwordInput = document.getElementById('password');
const passwordConfirmInput = document.getElementById('passwordConfirm');

document.getElementById('password-toggle').addEventListener('change', (event) => {
  const type = event.target.checked ? 'text' : 'password';
  passwordInput.type = type;
  passwordConfirmInput.type = type;
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (passwordInput.value !== passwordConfirmInput.value) {
    notify('Die Passwörter stimmen nicht überein.', 'error');
    return;
  }
  const password = passwordInput.value;
  try {
    await api.post('/auth/invite/redeem', { token, password });
    window.location.href = '/account.html';
  } catch (err) {
    notify(err.message, 'error');
  }
});
</script>
</body>
</html>
