<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>E-Mail bestätigen – Pakyrion</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<h1>E-Mail-Bestätigung</h1>
<p id="message">Wird geprüft…</p>
<p><a href="/login.html">Zum Login</a></p>
<script type="module">
import { api } from '/js/api.js';

const message = document.getElementById('message');
const token = new URLSearchParams(window.location.search).get('token');

if (!token) {
  message.textContent = 'Kein Bestätigungs-Token gefunden.';
  message.className = 'error';
} else {
  try {
    await api.get(`/auth/verify?token=${encodeURIComponent(token)}`);
    message.textContent = 'E-Mail-Adresse bestätigt. Du kannst dich jetzt einloggen.';
    message.className = 'success';
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
}
</script>
</body>
</html>
