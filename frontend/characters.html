<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine Charaktere – Pakyrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/chronicle-crest.css">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal">P</div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">Chronicle Registry</p>
  <div class="folio folio--wide">
    <nav class="app-nav">
      <a href="/account.html">Konto</a>
      <a href="/characters.html" class="current">Charaktere</a>
      <span id="admin-nav-links"></span>
      <a href="#" id="logout-link">Logout</a>
    </nav>
    <h1>Meine Charaktere</h1>
    <h2>Meine Anmeldungen</h2>
    <table id="registration-list">
      <thead><tr><th>Event</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p>
      <button type="button" id="register-button">Für ausgewähltes Event anmelden</button>
    </p>
    <p id="registration-message"></p>
    <h2>Meine Charaktere</h2>
    <div id="character-list" class="char-grid"></div>

    <h2 id="form-title">Neuen Charakter anlegen</h2>
    <form id="character-form">
      <label for="event-select">Event</label>
      <select id="event-select" name="eventId" required></select>
      <label for="character-name">Charaktername</label>
      <input id="character-name" name="name" type="text" required>
      <label for="copy-from-select">Von bestehendem Charakter übernehmen (optional)</label>
      <select id="copy-from-select"><option value="">– keinen übernehmen –</option></select>
      <div id="dynamic-fields"></div>
      <button type="submit">Speichern</button>
    </form>
    <p id="message"></p>
  </div>
</div>

<script type="module">
import { api } from '/js/api.js';
import { escapeHtml, renderField } from '/js/formFields.js';

const eventSelect = document.getElementById('event-select');
const dynamicFields = document.getElementById('dynamic-fields');
const form = document.getElementById('character-form');
const message = document.getElementById('message');
const listBody = document.getElementById('character-list');
const formTitle = document.getElementById('form-title');
const copyFromSelect = document.getElementById('copy-from-select');

const ADMIN_NAV_LINKS = '<a href="/admin/events.html">Events (Admin)</a><a href="/admin/checkin.html">Check-In (Admin)</a>';

let events = [];
let characters = [];
let editingCharacterId = null;
let userRole = 'participant';

const registrationListBody = document.querySelector('#registration-list tbody');
const registrationMessage = document.getElementById('registration-message');

const STATUS_LABELS = { registered: 'Angemeldet', checked_in: 'Eingecheckt', checked_out: 'Ausgecheckt' };

async function loadRegistrations() {
  const registrations = await api.get('/registrations');
  registrationListBody.innerHTML = registrations.map((r) => {
    const label = STATUS_LABELS[r.status] ?? r.status;
    return `<tr>
    <td>${escapeHtml(r.eventName)}</td>
    <td><span class="ribbon status-${escapeHtml(r.status)}">${escapeHtml(label)}</span></td>
    <td>${r.status === 'registered' ? `<button type="button" data-unregister="${r.eventId}">Abmelden</button>` : ''}</td>
  </tr>`;
  }).join('');

  registrationListBody.querySelectorAll('[data-unregister]').forEach((button) => {
    button.addEventListener('click', () => unregister(button.dataset.unregister));
  });
}

async function unregister(eventId) {
  registrationMessage.textContent = '';
  registrationMessage.className = '';
  try {
    await api.delete(`/events/${eventId}/register`);
    await loadRegistrations();
  } catch (err) {
    registrationMessage.textContent = err.message;
    registrationMessage.className = 'error';
  }
}

document.getElementById('register-button').addEventListener('click', async () => {
  registrationMessage.textContent = '';
  registrationMessage.className = '';
  const eventId = eventSelect.value;
  if (!eventId) return;
  try {
    await api.post(`/events/${eventId}/register`);
    registrationMessage.textContent = 'Angemeldet.';
    registrationMessage.className = 'success';
    await loadRegistrations();
  } catch (err) {
    registrationMessage.textContent = err.message;
    registrationMessage.className = 'error';
  }
});

function renderSchemaFields(schema, data = {}) {
  dynamicFields.innerHTML = schema.map((field) => renderField(field, data[field.key])).join('');
}

eventSelect.addEventListener('change', () => {
  const event = events.find((e) => e.id === eventSelect.value);
  renderSchemaFields(event ? event.character_form_schema : []);
});

// Participants may only create characters for the currently active event;
// admins/checkin_helpers keep the full list (e.g. to fix up past data).
function populateEventOptions() {
  const visibleEvents = userRole === 'participant' ? events.filter((e) => e.is_active) : events;
  eventSelect.innerHTML = visibleEvents.map((e) => `<option value="${e.id}">${escapeHtml(e.name)} (${escapeHtml(e.event_date)})</option>`).join('');
  if (visibleEvents.length > 0) {
    renderSchemaFields(visibleEvents[0].character_form_schema);
  } else {
    dynamicFields.innerHTML = '';
  }
}

async function loadEvents() {
  events = await api.get('/events');
  populateEventOptions();
}

function populateCopyFromOptions() {
  copyFromSelect.innerHTML = '<option value="">– keinen übernehmen –</option>' + characters.map((c) => {
    const event = events.find((e) => e.id === c.event_id);
    return `<option value="${c.id}">${escapeHtml(c.name)} (${escapeHtml(event ? event.name : c.event_id)})</option>`;
  }).join('');
}

copyFromSelect.addEventListener('change', () => {
  const source = characters.find((c) => c.id === copyFromSelect.value);
  if (!source) return;
  form.elements.name.value = source.name;
  const targetEvent = events.find((e) => e.id === eventSelect.value);
  renderSchemaFields(targetEvent ? targetEvent.character_form_schema : [], source.data);
});

function tagsForCharacter(c) {
  const event = events.find((e) => e.id === c.event_id);
  const schema = event ? event.character_form_schema : [];
  return schema
    .filter((field) => c.data[field.key] !== undefined && c.data[field.key] !== null && c.data[field.key] !== '')
    .map((field) => `<span class="tag">${escapeHtml(field.label)}: ${escapeHtml(c.data[field.key])}</span>`)
    .join('');
}

async function loadCharacters() {
  characters = await api.get('/characters');
  listBody.innerHTML = characters.map((c) => {
    const event = events.find((e) => e.id === c.event_id);
    const tagsHtml = tagsForCharacter(c);
    return `<div class="char-card">
      <h3>${escapeHtml(c.name)}</h3>
      <div class="char-meta">${escapeHtml(event ? event.name : c.event_id)}</div>
      <div class="char-tags">${tagsHtml}</div>
      <button type="button" data-edit="${c.id}" class="btn-ghost" style="margin-top:14px;">Bearbeiten</button>
    </div>`;
  }).join('');

  listBody.querySelectorAll('[data-edit]').forEach((button) => {
    button.addEventListener('click', () => startEdit(button.dataset.edit));
  });

  populateCopyFromOptions();
}

function startEdit(characterId) {
  const character = characters.find((c) => c.id === characterId);
  if (!character) return;
  editingCharacterId = characterId;
  formTitle.textContent = `Charakter bearbeiten: ${character.name}`;
  const event = events.find((e) => e.id === character.event_id);
  // The character's own event may not be in the (possibly filtered) dropdown
  // — e.g. a past/inactive event for a participant — so add it if missing,
  // purely so the disabled select displays the right name.
  if (event && !eventSelect.querySelector(`option[value="${event.id}"]`)) {
    const opt = document.createElement('option');
    opt.value = event.id;
    opt.textContent = `${event.name} (${event.event_date})`;
    eventSelect.appendChild(opt);
  }
  eventSelect.value = character.event_id;
  eventSelect.disabled = true;
  copyFromSelect.value = '';
  copyFromSelect.disabled = true;
  form.elements.name.value = character.name;
  renderSchemaFields(event ? event.character_form_schema : [], character.data);
  form.querySelector('button[type="submit"]').textContent = 'Änderungen speichern';
}

function resetForm() {
  editingCharacterId = null;
  formTitle.textContent = 'Neuen Charakter anlegen';
  eventSelect.disabled = false;
  copyFromSelect.disabled = false;
  copyFromSelect.value = '';
  form.reset();
  form.querySelector('button[type="submit"]').textContent = 'Speichern';
  populateEventOptions();
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  message.className = '';
  const formData = new FormData(form);
  const { eventId, name, ...rest } = Object.fromEntries(formData);
  try {
    if (editingCharacterId) {
      await api.put(`/characters/${editingCharacterId}`, { name, data: rest });
    } else {
      await api.post('/characters', { eventId, name, data: rest });
    }
    message.textContent = 'Gespeichert.';
    message.className = 'success';
    resetForm();
    await loadCharacters();
  } catch (err) {
    message.textContent = err.status === 400 && err.body?.details
      ? err.body.details.join(', ')
      : err.message;
    message.className = 'error';
  }
});

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

try {
  const account = await api.get('/account');
  userRole = account.role;
  if (account.role === 'admin') {
    document.getElementById('admin-nav-links').innerHTML = ADMIN_NAV_LINKS;
  }
  await loadEvents();
  await loadCharacters();
  await loadRegistrations();
} catch (err) {
  if (err.status === 401) window.location.href = '/login.html';
}
</script>
</body>
</html>
