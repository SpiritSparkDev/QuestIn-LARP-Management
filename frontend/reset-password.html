<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Passwort zurücksetzen – Pakyrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/chronicle-crest.css">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">QuestIn LARP Management</p>
  <div class="folio folio--narrow">
    <h1 class="text-center">Neues Passwort setzen</h1>
    <form id="reset-form">
      <label for="password">Neues Passwort</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <button type="submit">Passwort setzen</button>
    </form>
    <p id="message"></p>
    <p class="text-center"><a href="/login.html">Zum Login</a></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();

const form = document.getElementById('reset-form');
const message = document.getElementById('message');
const token = new URLSearchParams(window.location.search).get('token');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!token) {
    message.textContent = 'Kein Reset-Token gefunden.';
    message.className = 'error';
    return;
  }
  const password = document.getElementById('password').value;
  try {
    await api.post('/auth/password-reset/confirm', { token, password });
    message.textContent = 'Passwort wurde geändert. Du kannst dich jetzt einloggen.';
    message.className = 'success';
    form.reset();
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});
</script>
</body>
</html>
