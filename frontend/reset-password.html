<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort zurücksetzen – Pakyrion</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">QuestIn LARP Management</p>
  <div class="folio folio--narrow">
    <h1 class="text-center">Neues Passwort setzen</h1>
    <form id="reset-form">
      <label for="password">Neues Passwort</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <label for="passwordConfirm">Passwort wiederholen</label>
      <input id="passwordConfirm" type="password" minlength="8" required>
      <label><input type="checkbox" id="password-toggle"> Passwort anzeigen</label>
      <button type="submit">Passwort setzen</button>
    </form>
    <p class="text-center"><a href="/login.html">Zur Anmeldung</a></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { notify } from '/js/notifications.js';

const form = document.getElementById('reset-form');
const token = new URLSearchParams(window.location.search).get('token');
const passwordInput = document.getElementById('password');
const passwordConfirmInput = document.getElementById('passwordConfirm');

document.getElementById('password-toggle').addEventListener('change', (event) => {
  const type = event.target.checked ? 'text' : 'password';
  passwordInput.type = type;
  passwordConfirmInput.type = type;
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!token) {
    notify('Kein Reset-Token gefunden.', 'error');
    return;
  }
  if (passwordInput.value !== passwordConfirmInput.value) {
    notify('Die Passwörter stimmen nicht überein.', 'error');
    return;
  }
  const password = passwordInput.value;
  try {
    await api.post('/auth/password-reset/confirm', { token, password });
    notify('Passwort wurde geändert. Du kannst dich jetzt einloggen.', 'success');
    form.reset();
  } catch (err) {
    notify(err.message, 'error');
  }
});
</script>
</body>
</html>
