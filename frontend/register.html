<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrieren – Pakyrion</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/sahara.css">
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">QuestIn LARP Management</p>
  <div class="folio folio--narrow">
    <h1 class="text-center">Registrieren</h1>
    <form id="register-form">
      <input id="firstName" name="firstName" type="text" required>
      <label for="firstName">Vorname</label>
      <input id="lastName" name="lastName" type="text" required>
      <label for="lastName">Nachname</label>
      <input id="nickname" name="nickname" type="text">
      <label for="nickname">Rufname</label>
      <input id="email" name="email" type="email" required>
      <label for="email">E-Mail</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <label for="password">Passwort</label>
      <input id="passwordConfirm" type="password" minlength="8" required>
      <label for="passwordConfirm">Passwort wiederholen</label>
      <label><input type="checkbox" id="password-toggle"> Passwort anzeigen</label>
      <button type="submit">Registrieren</button>
    </form>
    <p class="text-center" style="margin-top:28px;"><a href="/login.html" class="btn-ghost">Bereits registriert? Anmelden</a></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { notify } from '/js/notifications.js';

const form = document.getElementById('register-form');
const passwordInput = document.getElementById('password');
const passwordConfirmInput = document.getElementById('passwordConfirm');

document.getElementById('password-toggle').addEventListener('change', (event) => {
  const type = event.target.checked ? 'text' : 'password';
  passwordInput.type = type;
  passwordConfirmInput.type = type;
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (passwordInput.value !== passwordConfirmInput.value) {
    notify('Die Passwörter stimmen nicht überein.', 'error');
    return;
  }
  const data = Object.fromEntries(new FormData(form));
  try {
    await api.post('/auth/register', data);
    notify('Konto erstellt. Bitte prüfe dein E-Mail-Postfach und bestätige deine Adresse, bevor du dich einloggst.', 'success');
    form.reset();
  } catch (err) {
    notify(err.message, 'error');
  }
});
</script>
</body>
</html>
