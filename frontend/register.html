<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Registrieren – Pakyrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/chronicle-crest.css">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">Chronicle Registry</p>
  <div class="folio folio--narrow">
    <h1 class="text-center">Registrieren</h1>
    <form id="register-form">
      <label for="firstName">Vorname</label>
      <input id="firstName" name="firstName" type="text" required>
      <label for="lastName">Nachname</label>
      <input id="lastName" name="lastName" type="text" required>
      <label for="nickname">Rufname</label>
      <input id="nickname" name="nickname" type="text">
      <label for="email">E-Mail</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" minlength="8" required>
      <button type="submit">Registrieren</button>
    </form>
    <p id="message"></p>
    <p class="text-center" style="margin-top:28px;"><a href="/login.html" class="btn-ghost">Bereits registriert? Login</a></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();

const form = document.getElementById('register-form');
const message = document.getElementById('message');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  message.className = '';
  const data = Object.fromEntries(new FormData(form));
  try {
    await api.post('/auth/register', data);
    message.textContent = 'Konto erstellt. Bitte prüfe dein E-Mail-Postfach und bestätige deine Adresse, bevor du dich einloggst.';
    message.className = 'success';
    form.reset();
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});
</script>
</body>
</html>
