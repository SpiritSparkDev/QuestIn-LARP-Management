<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mein Konto – Pakyrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/chronicle-crest.css">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal">P</div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">Chronicle Registry</p>
  <div class="folio folio--wide">
    <nav class="app-nav">
      <a href="/account.html" class="current">Konto</a>
      <a href="/characters.html">Charaktere</a>
      <span id="admin-nav-links"></span>
      <a href="#" id="logout-link">Logout</a>
    </nav>
    <h1>Mein Konto</h1>
    <form id="account-form">
      <label for="name">Name</label>
      <input id="name" name="name" type="text">
      <label for="address">Adresse <span class="sealed">Verschlüsselt</span></label>
      <input id="address" name="address" type="text">
      <label for="birthdate">Geburtsdatum <span class="sealed">Verschlüsselt</span></label>
      <input id="birthdate" name="birthdate" type="text" placeholder="TT.MM.JJJJ">
      <label for="phone">Telefon <span class="sealed">Verschlüsselt</span></label>
      <input id="phone" name="phone" type="text">
      <label for="emergencyContact">Notfallkontakt <span class="sealed">Verschlüsselt</span></label>
      <input id="emergencyContact" name="emergencyContact" type="text">
      <label for="medicalNotes">Gesundheitshinweise / Allergien <span class="sealed">Verschlüsselt</span></label>
      <textarea id="medicalNotes" name="medicalNotes"></textarea>
      <button type="submit">Speichern</button>
    </form>
    <p id="message"></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';

const form = document.getElementById('account-form');
const message = document.getElementById('message');
const formControls = form.querySelectorAll('input, textarea, button');
formControls.forEach((el) => { el.disabled = true; });

const ADMIN_NAV_LINKS = '<a href="/admin/events.html">Events (Admin)</a><a href="/admin/checkin.html">Check-In (Admin)</a>';

async function loadAccount() {
  try {
    const account = await api.get('/account');
    // Known limitation of this compat patch: gates on 'mitglieder' rather than
    // on events/checkin access directly, so a future group like plot_orga
    // (events+checkin but no mitglieder) would be backend-authorized but
    // wouldn't see these links. Fix belongs to the future menu-driven nav rework.
    if (account.menus.includes('mitglieder')) {
      document.getElementById('admin-nav-links').innerHTML = ADMIN_NAV_LINKS;
    }
    for (const field of ['name', 'address', 'birthdate', 'phone', 'emergencyContact', 'medicalNotes']) {
      form.elements[field].value = account[field] ?? '';
    }
    formControls.forEach((el) => { el.disabled = false; });
  } catch (err) {
    if (err.status === 401) {
      window.location.href = '/login.html';
      return;
    }
    message.textContent = err.message;
    message.className = 'error';
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  message.className = '';
  const data = Object.fromEntries(new FormData(form));
  try {
    await api.patch('/account', data);
    message.textContent = 'Gespeichert.';
    message.className = 'success';
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});

document.getElementById('logout-link').addEventListener('click', async (event) => {
  event.preventDefault();
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

loadAccount();
</script>
</body>
</html>
