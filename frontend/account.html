<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mein Konto – Pakyrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/chronicle-crest.css">
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal">P</div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">Chronicle Registry</p>
  <div class="folio folio--wide">
    <nav class="app-nav" id="nav-links"></nav>
    <a href="#" id="logout-link">Logout</a>
    <h1>Mein Konto</h1>
    <form id="account-form">
      <label for="name">Name</label>
      <input id="name" name="name" type="text">
      <label for="address">Adresse <span class="sealed">Verschlüsselt</span></label>
      <input id="address" name="address" type="text">
      <label for="birthdate">Geburtsdatum <span class="sealed">Verschlüsselt</span></label>
      <input id="birthdate" name="birthdate" type="text" placeholder="TT.MM.JJJJ">
      <label for="phone">Telefon <span class="sealed">Verschlüsselt</span></label>
      <input id="phone" name="phone" type="text">
      <label for="emergencyContact">Notfallkontakt <span class="sealed">Verschlüsselt</span></label>
      <input id="emergencyContact" name="emergencyContact" type="text">
      <label for="medicalNotes">Gesundheitshinweise / Allergien <span class="sealed">Verschlüsselt</span></label>
      <textarea id="medicalNotes" name="medicalNotes"></textarea>
      <label for="pronomen">Pronomen <span class="sealed">Verschlüsselt</span></label>
      <input id="pronomen" name="pronomen" type="text">
      <button type="submit">Speichern</button>
    </form>
    <div id="nsc-section" style="display:none;">
      <h2>NSC-Profil</h2>
      <form id="nsc-form">
        <div id="nsc-fields"></div>
        <button type="submit">NSC-Profil speichern</button>
      </form>
    </div>
    <p id="message"></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { renderNavLinks } from '/js/nav.js';
import { renderField, collectFieldValues } from '/js/formFields.js';

const form = document.getElementById('account-form');
const message = document.getElementById('message');
const formControls = form.querySelectorAll('input, textarea, button');
formControls.forEach((el) => { el.disabled = true; });

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

async function loadAccount() {
  try {
    const account = await api.get('/account');
    document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
    for (const field of ['name', 'address', 'birthdate', 'phone', 'emergencyContact', 'medicalNotes', 'pronomen']) {
      form.elements[field].value = account[field] ?? '';
    }
    formControls.forEach((el) => { el.disabled = false; });

    if (account.group.key === 'nsc') {
      const schemaRes = await api.get('/nsc-schema');
      document.getElementById('nsc-fields').innerHTML = schemaRes
        .map((field) => renderField(field, account.nscData?.[field.key]))
        .join('');
      document.getElementById('nsc-section').style.display = '';
      document.getElementById('nsc-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';
        message.className = '';
        const nscData = collectFieldValues(document.getElementById('nsc-form'), schemaRes);
        try {
          await api.patch('/account', { nscData });
          message.textContent = 'Gespeichert.';
          message.className = 'success';
        } catch (err) {
          message.textContent = err.status === 400 && err.body?.details ? err.body.details.join(', ') : err.message;
          message.className = 'error';
        }
      });
    }
  } catch (err) {
    if (err.status === 401) {
      window.location.href = '/login.html';
      return;
    }
    message.textContent = err.message;
    message.className = 'error';
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  message.className = '';
  const data = Object.fromEntries(new FormData(form));
  try {
    await api.patch('/account', data);
    message.textContent = 'Gespeichert.';
    message.className = 'success';
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});

loadAccount();
</script>
</body>
</html>
