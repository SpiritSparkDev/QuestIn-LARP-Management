<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Mein Konto – Pakyrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/chronicle-crest.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1/qrcode.min.js"></script>
</head>
<body>
<div class="shell">
  <div class="brand"><div class="brand-seal"></div><div class="brand-name">Pakyrion</div></div>
  <p class="brand-sub">QuestIn LARP Management</p>
  <div class="folio folio--wide">
    <nav class="app-nav" id="nav-links"></nav>
    <a href="#" id="logout-link">Logout</a>
    <h1>Mein Konto</h1>
    <form id="account-form">
      <label for="firstName">Vorname</label>
      <input id="firstName" name="firstName" type="text" required>
      <label for="lastName">Nachname</label>
      <input id="lastName" name="lastName" type="text" required>
      <label for="nickname">Rufname</label>
      <input id="nickname" name="nickname" type="text">
      <label for="address">Adresse <span class="sealed">Verschlüsselt</span></label>
      <input id="address" name="address" type="text">
      <label for="birthdate">Geburtsdatum <span class="sealed">Verschlüsselt</span></label>
      <input id="birthdate" name="birthdate" type="text" placeholder="TT.MM.JJJJ">
      <label for="phone">Telefon <span class="sealed">Verschlüsselt</span></label>
      <input id="phone" name="phone" type="text">
      <label for="emergencyContactLastName">Notfallkontakt: Name <span class="sealed">Verschlüsselt</span></label>
      <input id="emergencyContactLastName" name="emergencyContactLastName" type="text">
      <label for="emergencyContactFirstName">Notfallkontakt: Vorname <span class="sealed">Verschlüsselt</span></label>
      <input id="emergencyContactFirstName" name="emergencyContactFirstName" type="text">
      <label for="emergencyContactPhone">Notfallkontakt: Telefonnummer <span class="sealed">Verschlüsselt</span></label>
      <input id="emergencyContactPhone" name="emergencyContactPhone" type="text">
      <label for="medicalNotes">Gesundheitshinweise / Allergien <span class="sealed">Verschlüsselt</span></label>
      <textarea id="medicalNotes" name="medicalNotes"></textarea>
      <label for="conTage">Con-Tage des Spielers <span class="sealed">Verschlüsselt</span></label>
      <input id="conTage" name="conTage" type="text">
      <label for="accommodation">Unterbringung (Hütte/IT-Zelt/OT-Zelt, Anzahl, qm) <span class="sealed">Verschlüsselt</span></label>
      <input id="accommodation" name="accommodation" type="text">
      <label for="craftOffer">Angebotenes Handwerk <span class="sealed">Verschlüsselt</span></label>
      <input id="craftOffer" name="craftOffer" type="text">
      <label for="travelMethod">Anreise (Auto/Motorrad, Bahn, muss abgeholt werden) <span class="sealed">Verschlüsselt</span></label>
      <input id="travelMethod" name="travelMethod" type="text">
      <label for="dataSharingOptOut">Daten nicht an andere Teilnehmer weitergeben (Ja/Nein) <span class="sealed">Verschlüsselt</span></label>
      <input id="dataSharingOptOut" name="dataSharingOptOut" type="text">
      <label for="photoOptOut">Keine Fotoveröffentlichung (Ja/Nein) <span class="sealed">Verschlüsselt</span></label>
      <input id="photoOptOut" name="photoOptOut" type="text">
      <button type="submit">Speichern</button>
    </form>
    <div id="qr-section" style="display:none;">
      <hr class="rule">
      <h2>Mein QR-Code</h2>
      <p class="lede" id="qr-hint"></p>
      <canvas id="qr-canvas"></canvas>
    </div>
    <p id="message"></p>
  </div>
</div>
<script type="module">
import { api } from '/js/api.js';
import { applyBranding } from '/js/branding.js';
applyBranding();
import { renderNavLinks } from '/js/nav.js';
import { attachBirthdateFormatter } from '/js/formFields.js';
import { buildScanCode } from '/js/qrCode.js';

const form = document.getElementById('account-form');
const message = document.getElementById('message');
const formControls = form.querySelectorAll('input, textarea, button');
formControls.forEach((el) => { el.disabled = true; });
attachBirthdateFormatter(document.getElementById('birthdate'));

document.getElementById('logout-link').addEventListener('click', async (evt) => {
  evt.preventDefault();
  await api.post('/auth/logout', {});
  window.location.href = '/login.html';
});

async function loadQrCode(account) {
  const qrSection = document.getElementById('qr-section');
  const qrHint = document.getElementById('qr-hint');
  try {
    const [events, registrations] = await Promise.all([api.get('/events'), api.get('/registrations')]);
    const activeEvent = events.find((e) => e.is_active);
    if (!activeEvent) {
      qrSection.style.display = '';
      qrHint.textContent = 'Aktuell ist kein Event für die Anmeldung geöffnet.';
      return;
    }
    if (!activeEvent.code) {
      qrSection.style.display = '';
      qrHint.textContent = 'Für dieses Event ist noch kein QR-Code eingerichtet.';
      return;
    }
    const registration = registrations.find((r) => r.eventId === activeEvent.id);
    if (!registration) {
      qrSection.style.display = '';
      qrHint.textContent = `Du bist für "${activeEvent.name}" nicht angemeldet.`;
      return;
    }

    const code = buildScanCode({ eventCode: activeEvent.code, groupKey: account.group.key, userId: account.id });
    const qr = qrcode(0, 'M');
    qr.addData(code);
    qr.make();
    const moduleCount = qr.getModuleCount();
    const cellSize = 6;
    const canvas = document.getElementById('qr-canvas');
    canvas.width = moduleCount * cellSize;
    canvas.height = moduleCount * cellSize;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000000';
    for (let row = 0; row < moduleCount; row++) {
      for (let col = 0; col < moduleCount; col++) {
        if (qr.isDark(row, col)) ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
      }
    }

    qrSection.style.display = '';
    qrHint.textContent = `Für "${activeEvent.name}" — zeig diesen Code beim Check-In vor.`;
  } catch {
    // Branding-style fail-quiet: the QR section is a convenience, not core
    // account functionality, so a network hiccup here must not block or
    // error out the rest of the account page.
    qrSection.style.display = 'none';
  }
}

async function loadAccount() {
  try {
    const account = await api.get('/account');
    document.getElementById('nav-links').innerHTML = renderNavLinks(account, window.location.pathname);
    for (const field of ['firstName', 'lastName', 'nickname', 'address', 'birthdate', 'phone', 'emergencyContactLastName', 'emergencyContactFirstName', 'emergencyContactPhone', 'medicalNotes', 'conTage', 'accommodation', 'craftOffer', 'travelMethod', 'dataSharingOptOut', 'photoOptOut']) {
      form.elements[field].value = account[field] ?? '';
    }
    formControls.forEach((el) => { el.disabled = false; });
    await loadQrCode(account);
  } catch (err) {
    if (err.status === 401) {
      window.location.href = '/login.html';
      return;
    }
    message.textContent = err.message;
    message.className = 'error';
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  message.className = '';
  const data = Object.fromEntries(new FormData(form));
  try {
    await api.patch('/account', data);
    message.textContent = 'Gespeichert.';
    message.className = 'success';
  } catch (err) {
    message.textContent = err.message;
    message.className = 'error';
  }
});

loadAccount();
</script>
</body>
</html>
