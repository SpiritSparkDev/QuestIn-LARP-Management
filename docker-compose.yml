services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pakyrion
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pakyrion"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pakyrion_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/pakyrion
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend
      - ./db:/app/db
      - ./frontend:/app/frontend
    command: sh -c "npm run migrate && npm run seed-groups && npm run seed-nsc-schema && npm run seed-admin && npm run dev"

volumes:
  db-data:
